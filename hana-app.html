<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capsule Barre — Hana member app</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FFF8EC;
    --ink: #4A3B36;
    --soft: #5A4A44;
    --mute: #8C7B72;
    --line: #EEDFCC;
    --card: #fff;
    --ox: #E98597;
    --ox-ink: #fff;
    --pink-l: #FDE7EA;
    --mint: #B5E0CB;
    --ok: #2E6B52;
    --ok-bg: #E3F4EC;
    --warn: #9A6A4A;
    --warn-bg: #FBEDE2;
    --ox-bg: #FDE7EA;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #F4EBDD;
    color: var(--ink);
    font-family: Nunito, system-ui, sans-serif;
    font-weight: 700;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ox); outline-offset: 2px; }
  .shell {
    max-width: 1120px; margin: 0 auto; padding: 24px;
    display: grid; grid-template-columns: 220px 390px 1fr; gap: 24px; align-items: start;
  }
  .lede { color: var(--mute); font-size: 15px; line-height: 1.45; margin: 0 0 16px; font-weight: 500; }
  .brand { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; margin: 0 0 8px; }
  .brand em { font-style: normal; color: var(--ox); }
  .rail { background: #3B2E29; color: #f3f2ee; border-radius: 24px; padding: 16px 12px 24px; position: sticky; top: 16px; }
  .rail .brand { color: #f3f2ee; padding: 0 8px; }
  .clocks { display: flex; gap: 6px; margin-bottom: 12px; }
  .clocks button {
    flex: 1; border: 1px solid rgba(255,255,255,.16); background: transparent; color: #f3f2ee; border-radius: 12px; min-height: 40px; padding: 8px 4px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .clocks button.on { background: #f3f2ee; border-color: #f3f2ee; color: var(--ink); }
  .devbtn { width:100%; border:1px dashed rgba(255,255,255,.3); background:transparent; color:#f3f2ee; border-radius:12px; min-height:36px; font-size:12px; margin-bottom:12px; }
  .okbar { background:var(--ok-bg); color:var(--ok); border-radius:16px; padding:12px 14px; font-weight:800; margin-top:8px; animation: rise .45s ease; }
  .dots4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0 6px; }
  .dot4 { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--mute); }
  .dot4 i { height:8px; border-radius:999px; background:#F3E9DC; display:block; }
  .dot4.on i { background:var(--ox); } .dot4.on { color:var(--ink); }
  .otherrow strong { display:block; font-size:15px; }
  .railseg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: rgba(255,255,255,.08); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .railseg button { border: 0; background: transparent; color: rgba(243,242,238,.7); border-radius: 10px; min-height: 32px; font-size: 12px; font-weight: 700; }
  .railseg button.on { background: rgba(255,255,255,.14); color: #f3f2ee; }
  .jump { display: flex; flex-direction: column; gap: 2px; max-height: 640px; overflow: auto; }
  .jump::-webkit-scrollbar { width: 0; }
  .jump .group { margin: 12px 12px 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(243,242,238,.5); font-weight: 700; }
  .jump .group:first-child { margin-top: 0; }
  .jump button.spec { color: rgba(243,242,238,.42); }
  .jump button.spec::after { content: "spec"; float: right; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
  .jump button {
    text-align: left; border: 0; background: transparent; color: rgba(243,242,238,.82); border-radius: 12px;
    min-height: 40px; padding: 8px 12px; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .jump button:hover { background: rgba(255,255,255,.06); }
  .jump button.on { background: #f3f2ee; color: var(--ink); font-weight: 700; }
  .phone {
    width: 390px; height: 844px; background: #3B2E29; border-radius: 40px; padding: 12px;
    box-shadow: 0 32px 64px rgba(18,17,15,.16); position: sticky; top: 16px;
  }
  .screen {
    height: 100%; background: var(--paper); border-radius: 28px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }
  .status {
    display: flex; justify-content: space-between; padding: 12px 16px 0; font-size: 12px; font-weight: 700;
  }
  .scroll { flex: 1; overflow: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; }
  .scroll::-webkit-scrollbar { width: 0; }
  .tabs {
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; border-top: 1px solid var(--line);
    background: #fff; padding: 0 4px 10px; overflow: visible; border-radius: 22px 22px 0 0;
  }
  .tabs button {
    border: 0; background: transparent; color: var(--mute); font-size: 11px; font-weight: 500;
    min-height: 44px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button.on { color: var(--ink); font-weight: 700; }
  .tabs button.on { color: var(--ox); }
  .tabs button.ask { position: relative; top: -20px; margin-bottom: -20px; color: var(--ink); font-weight: 800; gap: 2px; }
  .tabs button.ask .fab {
    width: 60px; height: 60px; border-radius: 50%; background: #F5B5BD; display: grid; place-items: center;
    border: 5px solid var(--paper); box-shadow: 0 6px 14px rgba(233,133,151,.35);
  }
  .tabs button.ask svg, .tabs button.ask.on svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2; }
  .hero { text-align:center; margin-bottom:8px; }
  .thread { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .bubble { max-width:86%; padding:10px 12px; font-weight:800; font-size:15px; }
  .bubble.her { align-self:flex-start; background:#fff; border:2px solid var(--line); border-radius:4px 16px 16px 16px; }
  .bubble.me { align-self:flex-end; background:var(--ink); color:#FFF8EC; border-radius:16px 16px 4px 16px; }
  .replies { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .replies button { border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; min-height:40px; padding:0 14px; }
  .talk { display:flex; gap:8px; margin-top:12px; }
  .talk input { flex:1; border:2px solid var(--line); border-radius:999px; min-height:48px; padding:0 14px; background:#fff; font:inherit; font-weight:800; }
  .talk button { width:48px; height:48px; border:0; border-radius:50%; background:var(--ox); color:#fff; font-size:18px; }
  .sayrow { display:flex; flex-direction:column-reverse; align-items:center; gap:18px; margin:8px 0 12px; }
  .sayrow .say { position:relative; border-radius:22px; text-align:center; }
  .sayrow .say::after, .say.up::after { content:""; position:absolute; left:50%; bottom:-8px; width:12px; height:12px; background:#fff; border-right:2px solid var(--line); border-bottom:2px solid var(--line); transform:translateX(-50%) rotate(45deg); }
  .say.up { position:relative; border-radius:22px; text-align:center; margin-bottom:18px; }
  .hana-stage { display:flex; flex-direction:column; align-items:center; margin: 0 0 8px; }
  .hana-bubble {
    position: relative; background:#fff; border:2px solid var(--line); border-radius:28px;
    padding:14px 18px; margin-bottom:26px; width:100%; text-align:center;
    font-weight:800; font-size:16px; line-height:1.4; box-shadow:0 5px 0 #F3E6D3;
  }
  .hana-bubble::after {
    content:""; position:absolute; left:50%; bottom:-8px; width:14px; height:14px;
    background:#fff; border-right:2px solid var(--line); border-bottom:2px solid var(--line);
    transform:translateX(-50%) rotate(45deg);
  }
  .say { background:#fff; border:2px solid var(--line); border-radius:16px; padding:10px 12px; font-weight:800; }
  .mission { background:#fff; border:2px solid #F5B5BD; border-radius:26px; padding:16px; margin-top:8px; }
  .mission .k { font-size:12px; letter-spacing:.14em; color:var(--ox); }
  .mission h1 { font-size:26px; margin:4px 0 8px; }
  .dots { display:flex; gap:8px; margin:8px 0 4px; }
  .dots i { width:36px; height:10px; border-radius:999px; background:#eadfd4; display:block; }
  .dots i.on { background:var(--ox); }
  .moment-k { margin:4px 0 6px; }
  .card.moment { margin:0 0 10px; } .card.moment .kicker { margin:0 0 2px; } .card.moment .sub { margin:4px 0 0; }
  .okmark { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:#B5E0CB; border:1.5px solid #3B2E29; font-size:12px; margin-right:4px; }
  .mstreak { font-size:34px; font-weight:900; color:var(--ox); margin-right:4px; }
  .passpill.lowlink { display:inline-flex; align-items:center; gap:6px; border:0; font:inherit; font-size:12px; cursor:pointer; }
  .passpill.lowlink img { height:22px; width:auto; }
  .passpill { display:inline-block; background:#fff; border-radius:999px; padding:4px 10px; font-size:12px; color:#7d6454; }
  button.friend { width:100%; cursor:pointer; font:inherit; text-align:left; color:inherit; }
  .dock { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
  .dock button { min-height:56px; border-radius:16px; border:0; text-align:left; padding:8px 12px; font-weight:800; width:100%; }
  .dock .streak-btn { background:#fff; color:var(--ink); border:2px solid var(--line) !important; display:flex; gap:10px; align-items:center; }
  .dock .friends-btn { background:var(--pink-l); color:var(--ink); display:flex; gap:10px; align-items:center; }
  .dock svg { width:24px; height:24px; stroke:var(--ink); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .dock small { display:block; font-size:11px; letter-spacing:.08em; opacity:.85; }
  .friend { display:flex; gap:12px; align-items:center; background:#fff; border:1px solid #e4dfd4; border-radius:16px; padding:12px; margin-top:8px; }
  .friend i { width:36px; height:36px; border-radius:50%; background:var(--paper); border:1.5px solid var(--ink); color:var(--ink); display:grid; place-items:center; font-style:normal; font-weight:800; flex:none; }
  .friend b { display:block; font-size:14px; }
  .friend span { display:block; margin-top:2px; color:#7d6454; font-size:12px; font-weight:700; }
  .friend > div { min-width: 0; }
  .back { align-self:flex-start; border:0; background:transparent; color:var(--ink); font-weight:800; font-size:15px; min-height:44px; padding:0 4px; margin:0 0 8px; }
  .bigcount { margin:0 0 8px; font-size:72px; line-height:.9; letter-spacing:-.04em; font-weight:800; }
  .streakhead { display:block; margin:0 0 16px; }
  .streakhead .bigcount { margin:0; font-size:72px; color:var(--ink); }
  .streakhead p { margin:4px 0 0; text-align:left; color:var(--mute); font-size:15px; font-weight:700; line-height:1.3; }
  .streakday { display:grid; grid-template-columns:20px 1fr auto; align-items:center; gap:12px; background:#fff; border:1px solid #e4dfd4; border-radius:16px; min-height:52px; padding:12px 16px; margin-bottom:8px; }
  .streakday b { font-size:15px; font-weight:800; }
  .streakday span { font-size:13px; font-weight:700; color:#7d6454; }
  .streakday i { width:20px; height:20px; border-radius:50%; border:2px solid #eadfd4; }
  .streakday.done i { background:var(--mint); border-color:#8FCBAF; }
  .streakday.now { border-color:#2F3E46; }
  .streakday.now i { background:#2F3E46; border-color:#2F3E46; }
  .streakday.now span { color:#2F3E46; }
  .push { margin-top:auto; }
  .codebox .kicker { margin-bottom:4px; }
  .codebox b { display:block; font-size:28px; letter-spacing:.04em; line-height:1.1; margin:4px 0; }
  .codebox > span, .askcard > span { display:block; margin-top:4px; color:#7d6454; font-size:13px; font-weight:700; line-height:1.35; }
  .askcard > b { display:block; font-size:16px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .pair .btn, .pair .quiet { margin-top:0; }
  .quiet { border:0; background:#F3E9DC; color:var(--ink); border-radius:16px; min-height:48px; padding:12px 8px; font-weight:800; font-size:14px; }
  .nudge { background:var(--ink); color:#FFF8EC; border-radius:16px; padding:12px 14px; margin:8px 0; font-weight:800; }
  .streak { color:var(--ox); font-weight:800; margin:0 0 8px; }
  .share { background:#fff; border:2px dashed var(--ox); border-radius:16px; padding:12px 14px; margin-top:8px; }
  .postcard { background:#fff; border:1px solid #e4dfd4; border-radius:24px; padding:20px; margin:8px 0 16px; box-shadow:6px 6px 0 #F5B5BD; }
  .postcard b { display:block; font-size:32px; line-height:1.05; letter-spacing:-.03em; margin:4px 0 8px; }
  .postcard span, .postcard em { display:block; font-style:normal; font-weight:700; }
  .postcard span { font-size:15px; }
  .postcard em { margin-top:12px; color:#7d6454; font-size:13px; }
  .grab { display:block; width:36px; height:4px; border-radius:999px; background:#d8d5cb; margin:0 auto 12px; }
  .apps { display:flex; gap:8px; overflow:auto; padding:4px 0 8px; }
  .apps button { width:72px; flex:none; border:0; background:transparent; font-size:11px; font-weight:800; padding:0; }
  .apps i { width:56px; height:56px; border-radius:18px; display:grid; place-items:center; margin:0 auto 6px; font-style:normal; background:var(--paper); border:1.5px solid var(--line); color:var(--ink); }
  .apps i svg { width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .sheet-line { margin:0 0 12px; font-size:13px; font-weight:700; color:#7d6454; }
  .kicker { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.03em; line-height: 1.1; font-weight: 700; }
  .sub { margin: 0 0 16px; color: var(--mute); font-size: 15px; line-height: 1.4; font-weight: 500; }
  .time { font-family: Nunito, sans-serif; font-weight: 900; font-size: 96px; line-height: .82; margin: 0 0 8px; letter-spacing: .02em; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 8px;
    width: 100%; text-align: left;
  }
  .balance { padding: 24px; box-shadow: 0 6px 0 #F3E6D3; }
  .count { margin: 8px 0; font-family: Nunito, sans-serif; font-size: 28px; font-weight: 500; letter-spacing: -.03em; line-height: 1; }
  .count small { font-size: 15px; color: var(--mute); font-family: Nunito, sans-serif; }
  .slot {
    width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 22px;
    padding: 16px; margin-bottom: 8px;
  }
  .slot-row { display: flex; align-items: center; gap: 12px; }
  .when { width: 72px; flex: none; }
  .when b { display: block; font-family: Nunito, sans-serif; font-size: 28px; font-weight: 500; line-height: 1; letter-spacing: -.03em; }
  .when small { font-size: 12px; color: var(--mute); font-weight: 500; }
  .what { flex: 1; min-width: 0; }
  .what strong { display: block; font-size: 15px; font-weight: 700; }
  .what span { display: block; margin-top: 4px; font-size: 12px; color: var(--mute); font-weight: 500; }
  .slot .tag { flex: none; }
  .slot .meta { margin-top: 12px; }
  .timeline { margin: 8px 0 0 8px; padding-left: 16px; border-left: 2px solid var(--line); }
  .timeline .slot { position: relative; }
  .timeline .slot::before {
    content: ""; position: absolute; left: -22px; top: 24px; width: 10px; height: 10px; border-radius: 50%; background: var(--mute); border: 2px solid var(--paper);
  }
  .timeline .slot.ok::before { background: var(--ok); }
  .timeline .slot.warn::before { background: var(--warn); }
  .notice {
    margin: 8px 12px 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px;
    box-shadow: 0 12px 32px rgba(18,17,15,.14); animation: rise .35s ease;
  }
  .notice-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); font-weight: 700; margin-bottom: 4px; }
  .notice strong { display: block; font-size: 15px; }
  .notice p { margin: 4px 0 8px; font-size: 12px; color: var(--soft); }
  .notice-acts { display: flex; gap: 8px; }
  .notice-acts button { flex: 1; min-height: 44px; border: 0; border-radius: 14px; background: var(--ox); color: var(--ox-ink); font-weight: 700; font-size: 12px; }
  .notice-acts button.quiet { background: #F3E9DC; color: var(--ink); }
  .alert-row {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; margin-bottom: 8px; position: relative;
  }
  .alert-row .alert-ico { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; color: var(--soft); }
  .alert-row.unread .alert-ico { background: var(--ox-bg); color: var(--ink); }
  .alert-row > div { flex: 1; min-width: 0; }
  .alert-row strong { display: block; font-size: 15px; font-weight: 700; }
  .alert-row span:not(.alert-ico) { display: block; margin-top: 4px; font-size: 12px; color: var(--mute); font-weight: 500; }
  .alert-row em { font-style: normal; font-size: 12px; color: var(--mute); font-weight: 500; flex: none; padding-top: 2px; }
  .alert-row.unread em::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ox); margin-right: 6px; vertical-align: middle; }
  .switch-row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--line); border-radius: 16px; min-height: 64px; padding: 12px 16px; margin-bottom: 8px;
  }
  .switch-row > div { flex: 1; }
  .switch-row strong { display: block; font-size: 15px; font-weight: 700; }
  .switch-row span:not(.switch) { display: block; margin-top: 2px; font-size: 12px; color: var(--mute); font-weight: 500; }
  .switch { width: 44px; height: 26px; border-radius: 999px; background: #d8d5cb; position: relative; flex: none; transition: background .16s; }
  .switch i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .16s; box-shadow: 0 1px 2px rgba(18,17,15,.2); }
  .switch.on { background: #8FCBAF; }
  .switch.on i { transform: translateX(18px); }
  .chips { display: flex; gap: 8px; margin-bottom: 16px; }
  .chips.wrap { flex-wrap: wrap; }
  .chips.wrap .chip-btn { flex: 0 0 auto; padding: 0 14px; }
  .card.req .reply { margin-top: 12px; padding: 12px; background: var(--paper); border-radius: 12px; font-size: 15px; font-weight: 500; }
  .card.req .reply .lbl { display: block; margin-bottom: 4px; }
  .bubble.me { align-self: flex-end; max-width: 80%; background: var(--ink); color: #f3f2ee; border-radius: 16px 16px 4px 16px; padding: 10px 14px; font-size: 15px; font-weight: 500; margin: 8px 0; }
  .card.ai { border-color: #F5B5BD; }
  .card.ai strong { display: block; font-size: 15px; }
  .card.ai .meta { margin-top: 12px; }
  .btn.mini { width: auto; min-height: 40px; padding: 8px 14px; font-size: 12px; margin: 0; box-shadow: none; }
  .actions.ai-form { flex-direction: row; gap: 8px; align-items: center; }
  .ai-form input { flex: 1; min-height: 48px; border: 1px solid var(--line); border-radius: 999px; padding: 12px 16px; background: #fff; font-size: 15px; font-weight: 500; }
  .ai-form .btn { width: 48px; min-height: 48px; padding: 0; margin: 0; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .chip-btn { flex: 1; min-height: 44px; border: 1px solid var(--line); background: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--soft); }
  .chip-btn.on { background: var(--ox); border-color: var(--ox); color: #fff; }
  .field textarea {
    width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 500; line-height: 1.4; resize: none; font-family: inherit; color: var(--ink);
  }
  .what-sub { display: block; margin-top: 4px; font-size: 12px; color: var(--mute); font-weight: 500; }
  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 24px; }
  .actions .btn { margin-top: 0; }
  #authForm, #newPassForm { display: flex; flex-direction: column; flex: 1; }
  #authForm .btn, #newPassForm .btn { margin-top: auto; }
  .slot.press, .btn, .menu-row { transition: transform .16s ease; }
  .slot.press:active, .btn:active, .menu-row:active { transform: scale(.98); }
  .card.press { cursor: pointer; }
  .card.press:active { transform: scale(.99); }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
  .tag { display: inline-flex; align-items: center; min-height: 24px; border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 700; background: #F3E9DC; color: var(--soft); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.ox { background: var(--ox-bg); color: #C4566A; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  /* Button system: .btn primary (one per screen, oxidized red) · .btn.ghost secondary · .link tertiary · .btn.done is a state, not a control */
  .btn {
    width: 100%; border: 0; border-radius: 20px; min-height: 50px; padding: 12px 16px; font-weight: 800; font-size: 15px;
    background: var(--ox); color: var(--ox-ink); margin-top: 8px;
    box-shadow: 0 6px 0 #F3C9CF;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn.push, .push { margin-top: auto; }
  .btn.done { background: var(--ok); color: #fff; }
  .peak { animation: rise .45s ease; }
  @keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #F3E9DC; border-radius: 16px; padding: 4px; margin-bottom: 16px; }
  .seg button { border: 0; background: transparent; border-radius: 12px; min-height: 44px; padding: 8px; font-weight: 500; font-size: 15px; }
  .seg button.on { background: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(18,17,15,.06); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--mute); margin-bottom: 4px; letter-spacing: .08em; text-transform: uppercase; }
  .field input {
    width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px; min-height: 48px; padding: 12px 16px; font-size: 15px; font-weight: 700;
  }
  .err { color: #C4566A; font-size: 12px; font-weight: 700; margin: 4px 0 0; }
  .field.bad input { border-color: var(--ox); }
  .otp { display: flex; gap: 8px; justify-content: space-between; }
  .otp input { width: 48px; height: 56px; text-align: center; font-size: 28px; font-weight: 700; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; color: var(--soft); margin: 8px 0 16px; }
  .check input { width: 20px; height: 20px; margin-top: 2px; }
  .link { border: 0; background: transparent; color: #C4566A; font-weight: 700; font-size: 15px; padding: 8px 0; min-height: 44px; width: auto; align-self: flex-start; text-align: left; }
  .top { display: flex; align-items: center; margin-bottom: 16px; gap: 8px; }
  .pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; min-height: 44px; padding: 8px 14px; font-size: 15px; font-weight: 900; }
  .chip { margin-left: auto; border-radius: 999px !important; background: var(--pink-l) !important; font-family: Nunito, sans-serif; font-size: 12px; font-weight: 500; background: #F3E9DC; color: var(--ink); border-radius: 8px; padding: 8px; white-space: nowrap; }
  .map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 16px; }
  .pad {
    min-height: 88px; border: 1px solid var(--line); background: #fff; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 28px;
  }
  .pad small { font-size: 12px; font-weight: 500; color: var(--mute); margin-top: 4px; }
  .pad.taken { background: #F3E9DC; color: var(--mute); }
  .pad.mine { background: var(--ox); color: #fff; border-color: var(--ox); box-shadow: 0 6px 0 #F3C9CF; }
  .pad.mine small { color: rgba(255,255,255,.72); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .stat { background: var(--paper); border-radius: 12px; padding: 16px; }
  .stat b { display: block; font-family: Nunito, sans-serif; font-size: 28px; font-weight: 500; letter-spacing: -.03em; }
  .stat small { font-family: Nunito, sans-serif; font-size: 12px; font-weight: 500; }
  .stat.after b { color: var(--ox); }
  .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
  .meter { height: 8px; background: #F3E9DC; border-radius: 999px; overflow: hidden; margin-top: 16px; }
  .meter span { display: block; height: 100%; background: #F5B5BD; border-radius: inherit; }
  .toast {
    position: absolute; left: 16px; right: 16px; bottom: 168px; background: var(--ink); border-radius: 999px !important; color: #fff;
    border-radius: 16px; padding: 12px 16px; font-size: 15px; font-weight: 700; z-index: 2;
    transform: translateY(-8px); opacity: 0; pointer-events: none; transition: .24s ease;
    box-shadow: 0 16px 32px rgba(18,17,15,.2);
  }
  .toast.show { transform: none; opacity: 1; }
  .sheet { position: absolute; inset: 0; background: rgba(18,17,15,.32); display: none; align-items: end; }
  .sheet.open { display: flex; }
  .sheet .box { width: 100%; background: var(--paper); border-radius: 28px 28px 0 0; padding: 16px 16px 24px; }
  .note { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .note h2 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.02em; }
  .note p { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.45; }
  .week { display: flex; gap: 8px; margin-bottom: 16px; }
  .week button {
    flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 12px; min-height: 56px; padding: 8px 0; font-size: 12px; font-weight: 700;
  }
  .week button.on { background: var(--ox); color: #fff; border-color: var(--ox); }
  .week button:disabled { opacity: .55; cursor: not-allowed; background: transparent; border-style: dashed; color: var(--mute); text-decoration: line-through; }
  .ico { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .menu-row {
    display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: #fff; border-radius: 16px; min-height: 64px; padding: 12px 16px; margin-bottom: 8px;
  }
  .menu-row strong { display: block; font-size: 15px; font-weight: 700; }
  .menu-row span { color: var(--mute); font-size: 12px; font-weight: 500; }
  .menu-row .go { margin-left: auto; color: var(--mute); font-size: 22px; }
  .menu-row > svg { color: var(--ink); }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; background: var(--pink-l); color: var(--ink); border: 2px solid #F5B5BD;
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
  }
  .bell {
    border: 1px solid var(--line); background: #fff; border-radius: 50%; width: 44px; height: 44px;
    display: grid; place-items: center; position: relative; flex: none;
  }
  .bell .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; background: var(--ox); border-radius: 50%; }
  .who { display: flex; align-items: center; gap: 16px; margin: 8px 0 24px; }
  .who h1, .who .sub { margin: 0; }
  .tiny { font-size: 15px; color: var(--mute); margin: 0 0 8px; }

  /* Hana: the member's real artwork + layered motion.
     .fig  = travel (hop / sway / tilt), .sq = squash & stretch from the feet, .prop = ?/trophy layer,
     .fx   = ambient palette shapes (hearts, sparkles, zzz, drops, rings, leaves, cloud, check, stars, notes).
     Transform/opacity only. One-shot entrance/exit between poses, looping idle, random 'life' micro-actions, per-pose tap. */
  .hw { position:relative; width:96px; height:120px; flex:none; }
  .hero .hw, .hana-stage .hw { width:220px; height:172px; margin:0 auto 8px; }
  .sayrow .hw { width:80px; height:96px; }
  .hw .fig, .hw .sq { position:absolute; inset:0; transform-origin:50% 100%; }
  .hw img { position:absolute; bottom:0; left:50%; max-width:100%; max-height:100%; width:auto; height:auto; translate:-50% 0; -webkit-user-drag:none; user-select:none; pointer-events:none; }
  .hw .fx { position:absolute; inset:-14px; pointer-events:none; }
  .hw .fx > * { position:absolute; display:block; opacity:0; transform-origin:50% 50%; }
  .hw .fx svg { overflow:visible; }
  .hw .shadow { position:absolute; left:26%; right:26%; bottom:-3px; height:9px; border-radius:50%; background:rgba(74,59,54,.12); transform-origin:50% 50%; }
  .hw .veil { position:absolute; inset:-6px; border-radius:40%; background:radial-gradient(closest-side, rgba(201,194,188,.35), rgba(201,194,188,0)); opacity:0; pointer-events:none; }
  .hana-stage .hw, .hero .hw { cursor:pointer; }
  .sayrow .hw .fx { display:none; }

  /* entrance / exit */
  .hw .fig.prevfig { animation:hexit .32s cubic-bezier(.5,0,.8,.4) both !important; pointer-events:none; }
  .hw .fig.prevfig .sq, .hw .fig.prevfig .prop { animation:none !important; }
  .hw .fig.enter { animation:henter .55s cubic-bezier(.2,1.5,.4,1) both, var(--fig) !important; animation-delay:.12s, .67s !important; }
  @keyframes hexit { to { opacity:0; transform:translateY(8px) scale(.9,.84); } }
  @keyframes henter { 0%{opacity:0; transform:translateY(14px) scale(.7,.6)} 55%{opacity:1; transform:translateY(-6px) scale(1.06,.96)} 100%{opacity:1; transform:none} }

  /* default idle: a breathing bob, staggered between travel and squash */
  .hw .fig { --fig: hbobT 3.2s cubic-bezier(.45,0,.55,1) infinite; animation: var(--fig); }
  .hw .sq  { --sq: hbreath 3.2s cubic-bezier(.45,0,.55,1) .4s infinite; animation: var(--sq); }
  @keyframes hbobT { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes hbreath { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.015,.985)} }

  /* greet: wave bob, rocks toward the waving paw, hearts pop */
  @keyframes hgreetT { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-6px) rotate(2.5deg)} 50%{transform:translateY(0) rotate(0)} 70%{transform:translateY(-3px) rotate(1.5deg)} }
  @keyframes hgreetS { 0%,100%{transform:scale(1)} 48%{transform:scale(1.04,.95)} 56%{transform:scale(.98,1.02)} }
  .hw[data-s=greet] .fig { --fig: hgreetT 2.6s cubic-bezier(.45,0,.55,1) infinite; }
  .hw[data-s=greet] .sq  { --sq: hgreetS 2.6s ease-in-out infinite; }
  @keyframes hheart { 0%{opacity:0; transform:translateY(8px) scale(.3)} 15%{opacity:1; transform:translateY(0) scale(1.15)} 25%{transform:scale(1)} 70%{opacity:1; transform:translateY(-22px) rotate(-8deg)} 85%,100%{opacity:0; transform:translateY(-30px) scale(.8)} }
  .hw[data-s=greet] .fx .xheart { animation:hheart 2.6s ease-out infinite; }
  .hw[data-s=greet] .fx .xheart:nth-child(2) { animation-delay:.9s; } .hw[data-s=greet] .fx .xheart:nth-child(3) { animation-delay:1.7s; }
  @keyframes hnote { 0%{opacity:0; transform:translate(0,6px) rotate(-10deg)} 20%{opacity:1} 50%{transform:translate(6px,-12px) rotate(10deg)} 80%{opacity:1} 100%{opacity:0; transform:translate(-2px,-26px) rotate(-6deg)} }
  .hw[data-s=greet] .fx .xnote { animation:hnote 3.4s ease-in-out .5s infinite; }

  /* warmup: side-stretch sway from the feet, sweat drop, stretch lines */
  @keyframes hswayT { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
  @keyframes hswayS { 0%,50%,100%{transform:scale(1)} 25%,75%{transform:scale(.98,1.03)} }
  .hw[data-s=warmup] .fig { --fig: hswayT 2.8s cubic-bezier(.45,0,.55,1) infinite; }
  .hw[data-s=warmup] .sq  { --sq: hswayS 2.8s ease-in-out infinite; }
  @keyframes hdrop { 0%,30%{opacity:0; transform:translate(0,-4px) scale(.5)} 40%{opacity:1; transform:scale(1)} 80%{opacity:1; transform:translate(-4px,16px)} 100%{opacity:0; transform:translate(-5px,22px)} }
  .hw[data-s=warmup] .fx .xdrop { animation:hdrop 2.2s ease-in infinite; }
  @keyframes hlines { 0%,100%{opacity:0; transform:scaleX(.4)} 30%,60%{opacity:.9; transform:scaleX(1)} }
  .hw[data-s=warmup] .fx .xlines { animation:hlines 1.4s ease-in-out infinite; }
  .hw[data-s=warmup] .fx .xlines.r { animation-delay:.7s; }

  /* cheer: high hop with squash/stretch, shadow shrinks, sparkle bursts, rest beats between hops */
  @keyframes hcheerT { 0%{transform:translateY(0)} 8%{transform:translateY(0)} 22%{transform:translateY(-26px)} 34%{transform:translateY(0)} 42%{transform:translateY(-9px)} 50%,100%{transform:translateY(0)} }
  @keyframes hcheerS { 0%{transform:scale(1)} 7%{transform:scale(1.1,.86)} 13%{transform:scale(.92,1.1)} 30%{transform:scale(1)} 35%{transform:scale(1.12,.86)} 40%{transform:scale(.97,1.04)} 49%{transform:scale(1.04,.96)} 56%,100%{transform:scale(1)} }
  @keyframes hcheerSh { 0%,8%{transform:scale(1); opacity:1} 22%{transform:scale(.55); opacity:.5} 34%{transform:scale(1.1); opacity:1} 42%{transform:scale(.82)} 50%,100%{transform:scale(1); opacity:1} }
  .hw[data-s=cheer] .fig { --fig: hcheerT 2.4s linear infinite; }
  .hw[data-s=cheer] .sq  { --sq: hcheerS 2.4s linear infinite; }
  .hw[data-s=cheer] .shadow { animation:hcheerSh 2.4s linear infinite; }
  @keyframes hburst { 0%,18%{opacity:0; transform:scale(.2) rotate(0)} 26%{opacity:1; transform:scale(1.2) rotate(30deg)} 40%{opacity:1; transform:scale(.9) rotate(60deg)} 52%,100%{opacity:0; transform:scale(.3) rotate(90deg)} }
  .hw[data-s=cheer] .fx .xspark, .hw[data-s=cheer] .fx .xsparkm { animation:hburst 2.4s ease-out infinite; }
  .hw[data-s=cheer] .fx .xsparkm { animation-delay:.1s; }
  .hw[data-s=cheer] .fx .xspark:nth-child(2){animation-delay:.06s} .hw[data-s=cheer] .fx .xspark:nth-child(3){animation-delay:.12s} .hw[data-s=cheer] .fx .xspark:nth-child(4){animation-delay:.18s}

  /* calm: slow breathing, expanding mint ring, floating leaves */
  @keyframes hcalmT { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
  @keyframes hcalmS { 0%,100%{transform:scale(1)} 45%,55%{transform:scale(1.03)} }
  .hw[data-s=calm] .fig { --fig: hcalmT 4s cubic-bezier(.45,0,.55,1) infinite; }
  .hw[data-s=calm] .sq  { --sq: hcalmS 4s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes hring { 0%{opacity:0; transform:scale(.55)} 20%{opacity:.8} 100%{opacity:0; transform:scale(1.25)} }
  .hw[data-s=calm] .fx .xring { animation:hring 4s ease-out infinite; } .hw[data-s=calm] .fx .xring.b { animation-delay:2s; }
  @keyframes hleaf { 0%{opacity:0; transform:translate(0,10px) rotate(0)} 20%{opacity:1} 50%{transform:translate(10px,-14px) rotate(40deg)} 80%{opacity:1} 100%{opacity:0; transform:translate(-4px,-36px) rotate(-20deg)} }
  .hw[data-s=calm] .fx .xleaf { animation:hleaf 5s ease-in-out infinite; } .hw[data-s=calm] .fx .xleaf.b { animation-delay:2.4s; }

  /* paused: tilt, ? bobbing from its own corner, soft dim */
  @keyframes htiltT { 0%,100%{transform:rotate(0)} 40%,60%{transform:rotate(-2.5deg)} }
  @keyframes hqbob { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-5px) rotate(8deg)} }
  @keyframes hveil { 0%,100%{opacity:.5} 50%{opacity:1} }
  .hw[data-s=paused] .fig { --fig: htiltT 4.4s cubic-bezier(.45,0,.55,1) infinite; }
  .hw[data-s=paused] .prop { transform-origin:78% 13%; animation:hqbob 2.2s ease-in-out infinite; }
  .hw[data-s=paused] .veil { animation:hveil 4.4s ease-in-out infinite; }

  /* low: slow droopy sigh, small grey cloud */
  @keyframes hsighS { 0%,100%{transform:scale(1,1)} 40%{transform:scale(1.01,.97)} 60%{transform:scale(1.01,.97)} }
  @keyframes hsighT { 0%,100%{transform:translateY(0)} 50%{transform:translateY(1px)} }
  .hw[data-s=low] .fig { --fig: hsighT 4.6s ease-in-out infinite; }
  .hw[data-s=low] .sq  { --sq: hsighS 4.6s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes hcloud { 0%,100%{opacity:.85; transform:translateX(0)} 50%{opacity:1; transform:translateX(6px)} }
  @keyframes hrain { 0%{opacity:0; transform:translateY(0)} 30%{opacity:.9} 100%{opacity:0; transform:translateY(14px)} }
  .hw[data-s=low] .fx .xcloud { animation:hcloud 4.6s ease-in-out infinite; }
  .hw[data-s=low] .fx .xrain { animation:hrain 1.6s ease-in infinite; } .hw[data-s=low] .fx .xrain.b { animation-delay:.8s; }

  /* nobook + sleep: puzzled tilt, ? pops in then bobs; sleep adds zzz */
  @keyframes hpuzzT { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
  @keyframes hqpop { 0%{opacity:0; transform:scale(0)} 60%{opacity:1; transform:scale(1.2)} 100%{opacity:1; transform:scale(1)} }
  .hw[data-s=nobook] .fig, .hw[data-s=sleep] .fig { --fig: hpuzzT 3.6s cubic-bezier(.45,0,.55,1) infinite; }
  .hw[data-s=nobook] .prop, .hw[data-s=sleep] .prop { transform-origin:85% 13%; animation:hqpop .5s cubic-bezier(.2,1.6,.4,1) .5s both, hqbob 2.4s ease-in-out 1s infinite; }
  @keyframes hz { 0%{opacity:0; transform:translate(0,4px) scale(.5)} 25%{opacity:1} 100%{opacity:0; transform:translate(14px,-24px) scale(1.15)} }
  .hw[data-s=sleep] .fx .xz { animation:hz 2.7s ease-out infinite; } .hw[data-s=sleep] .fx .xz:nth-child(2){animation-delay:.9s} .hw[data-s=sleep] .fx .xz:nth-child(3){animation-delay:1.8s}
  .hw[data-s=sleep] .sq { --sq: hcalmS 4.4s ease-in-out infinite; }

  /* book: unroll bounce, check pops */
  @keyframes hbookT { 0%,100%{transform:translateY(0)} 18%{transform:translateY(-8px)} 32%{transform:translateY(0)} 42%{transform:translateY(-3px)} 52%{transform:translateY(0)} }
  @keyframes hbookS { 0%,100%{transform:scale(1)} 6%{transform:scale(1.06,.93)} 32%{transform:scale(1.05,.95)} 38%{transform:scale(.99,1.01)} }
  @keyframes hcheck { 0%,20%{opacity:0; transform:scale(0) rotate(-20deg)} 30%{opacity:1; transform:scale(1.25) rotate(6deg)} 38%{transform:scale(1) rotate(0)} 85%{opacity:1; transform:scale(1)} 100%{opacity:0; transform:scale(.8)} }
  .hw[data-s=book] .fig { --fig: hbookT 2.2s ease-in-out infinite; }
  .hw[data-s=book] .sq  { --sq: hbookS 2.2s ease-in-out infinite; }
  .hw[data-s=book] .fx .xcheck { animation:hcheck 2.2s ease-out infinite; }
  .hw[data-s=book] .fx .xspark { animation:hburst 2.2s ease-out .1s infinite; }

  /* cleared: proud double bounce, trophy shines and wiggles, stars */
  @keyframes hproudT { 0%{transform:translateY(0)} 10%{transform:translateY(-12px)} 20%{transform:translateY(0)} 30%{transform:translateY(-8px)} 40%,100%{transform:translateY(0)} }
  @keyframes hproudS { 0%{transform:scale(1)} 3%{transform:scale(1.06,.93)} 8%{transform:scale(.96,1.05)} 20%{transform:scale(1.07,.92)} 26%{transform:scale(.98,1.03)} 40%{transform:scale(1.04,.96)} 46%,100%{transform:scale(1)} }
  @keyframes hproudSh { 0%,100%{transform:scale(1)} 10%{transform:scale(.7)} 20%{transform:scale(1.05)} 30%{transform:scale(.8)} 40%{transform:scale(1)} }
  @keyframes hwiggle { 0%,45%,100%{transform:rotate(0)} 55%{transform:rotate(-8deg)} 65%{transform:rotate(8deg)} 75%{transform:rotate(-4deg)} 85%{transform:rotate(0)} }
  @keyframes hshine { 0%,40%{opacity:0; transform:scale(.6) rotate(0)} 55%{opacity:1; transform:scale(1.1) rotate(20deg)} 100%{opacity:0; transform:scale(1) rotate(60deg)} }
  @keyframes htwinkle { 0%,100%{opacity:0; transform:scale(.3)} 50%{opacity:1; transform:scale(1.1) rotate(25deg)} }
  .hw[data-s=cleared] .fig { --fig: hproudT 2.8s linear infinite; }
  .hw[data-s=cleared] .sq  { --sq: hproudS 2.8s linear infinite; }
  .hw[data-s=cleared] .shadow { animation:hproudSh 2.8s linear infinite; }
  .hw[data-s=cleared] .prop { transform-origin:85% 22%; animation:hwiggle 2.8s ease-in-out infinite; }
  .hw[data-s=cleared] .fx .xshine { animation:hshine 2.8s ease-out infinite; }
  .hw[data-s=cleared] .fx .xstar { animation:htwinkle 1.8s ease-in-out infinite; }
  .hw[data-s=cleared] .fx .xstar:nth-child(3){animation-delay:.6s} .hw[data-s=cleared] .fx .xstar:nth-child(4){animation-delay:1.2s}

  /* wink: thumbs-up pop once, sparkle, then a soft settle */
  @keyframes hwinkS { 0%{transform:scale(1)} 20%{transform:scale(1.1,.88)} 45%{transform:scale(.94,1.08)} 70%{transform:scale(1.03,.97)} 100%{transform:scale(1)} }
  .hw[data-s=wink] .sq { --sq: hwinkS .6s cubic-bezier(.3,1.4,.5,1) 1, hbreath 3.2s ease-in-out .6s infinite; }
  .hw[data-s=wink] .fx .xspark { animation:hburst 1.6s ease-out infinite; }

  /* random 'life' micro-actions (JS adds one class for ~0.7s): ear twitch, little look, tiny hop */
  @keyframes ltwitch { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-2.5deg)} 50%{transform:rotate(1.5deg)} 75%{transform:rotate(-1deg)} }
  @keyframes llook { 0%,100%{transform:translateX(0) skewX(0)} 30%,70%{transform:translateX(3px) skewX(-2deg)} }
  @keyframes lhop { 0%,100%{transform:translateY(0) scale(1)} 30%{transform:translateY(-5px) scale(.98,1.02)} 60%{transform:translateY(0) scale(1.03,.97)} }

function runJump(f, key) {
  toast.msg = null;
  closeSheet();
  restore();
  const feat = f && FEATURES.find(x => x.f === f);
  state.feature = feat ? f : null;
  state.jump = feat ? null : key;
  if (feat) feat.go(); else (JUMPS.find(j => j.key && j.key === key) || JUMPS.find(j => j.key === "today")).go();
}
document.getElementById("jump").onclick = (e) => {
  const b = e.target.closest("[data-jump]"); if (!b) return;
  runJump(b.dataset.f || null, b.dataset.jump);
  render();
};

/* Clock: time travel keeps who you are and what is booked, and resets the day's progress from the clean copy. */
function setClock(c) {
  closeSheet();
  const order = { am: 0, pm: 1, night: 2 };
  const keep = ["auth", "tab", "view", "studio", "booking", "lateCancel", "wait", "location", "bookTab", "day", "alerts", "requests", "chat", "friends", "incoming", "outgoing"];
  if (order[c] >= order[state.clock]) keep.push("arrived", "arrivedVia", "sharedIn", "attended", "sharedDone", "streak");  /* forward in time keeps the day's progress */
  restore(keep);
  state.clock = c; tick(); render();
}
document.getElementById("clkAm").onclick = () => setClock("am");
document.getElementById("clkPm").onclick = () => setClock("pm");
document.getElementById("clkNight").onclick = () => setClock("night");
document.getElementById("devAttended").onclick = () => {   /* dev control: the studio marks attendance (server event) */
  if (state.booking && state.arrived) { state.attended = true; alert("check", "Attended · Barre", "Marked by the studio"); toast("Studio marked attended"); }
  else toast("Check in first");
  render();
};
/* Dev check: running the same jump twice must give the same state. Open with ?dev to run it. */
function checkJumps() {
  const snap = () => JSON.stringify(state);
  const bad = [];
  [...JUMPS.filter(j => j.key).map(j => [null, j.key]), ...FEATURES.filter(x => x.f).map(x => [x.f, null])].forEach(([f, k]) => {
    runJump(f, k); const a = snap(); runJump(f, k); const b = snap();
    if (a !== b) bad.push(f || k);
  });
  restore(); render();
  if (bad.length) console.error("jump not repeatable:", bad.join(", ")); else console.log("checkJumps: all jumps repeatable");
  return bad;
}
