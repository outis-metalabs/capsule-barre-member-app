<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B · Daily mission — Capsule Barre</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#141821; --card:#1e2433; --line:#343b4f; --gold:#e4c56a; --ink:#f4f0e6; --mute:#9aa3b8; --ok:#7dcea0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:#0c0e14; color:var(--ink); font-family:"IBM Plex Sans",sans-serif; display:grid; place-items:center; padding:24px; }
  .phone { width:390px; height:844px; background:var(--bg); border-radius:36px; border:1px solid #2a3144; display:flex; flex-direction:column; overflow:hidden; }
  .top { padding:26px 20px 0; display:flex; justify-content:space-between; font-size:12px; letter-spacing:.14em; color:var(--gold); font-weight:700; }
  .body { padding:16px 20px 24px; }
  .k { font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em; color:var(--mute); }
  h1 { font-size:28px; margin:6px 0 4px; letter-spacing:-.03em; }
  .sub { color:var(--mute); margin:0 0 16px; }
  .quest { border:1px solid var(--line); background:var(--card); border-radius:16px; padding:14px 14px 8px; }
  .row { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .box { width:22px; height:22px; border:2px solid var(--gold); border-radius:6px; flex:none; display:grid; place-items:center; font-size:14px; color:var(--bg); }
  .box.on { background:var(--gold); }
  .row b { display:block; }
  .row span { color:var(--mute); font-size:13px; }
  .reward { margin-top:12px; border:1px dashed var(--line); border-radius:16px; padding:14px; color:var(--mute); }
  .reward b { color:var(--ink); }
  .meter { font-family:"IBM Plex Mono",monospace; margin-top:16px; }
  button { width:100%; margin-top:16px; background:var(--gold); color:#1a1508; border:0; border-radius:12px; min-height:52px; font-weight:700; font-size:16px; }
  button:disabled { opacity:.4; }
  .note { position:fixed; left:24px; top:24px; width:280px; color:#d5d0c4; font-size:14px; }
  .note b { display:block; margin-bottom:6px; color:var(--gold); }
  @media (max-width:900px) { .note { position:static; width:auto; margin-bottom:16px; } body { display:block; } .phone { margin:0 auto; } }
</style>
</head>
<body>
<aside class="note"><b>B · Daily mission</b> Tonight is one quest. Accept and check-in do not spend the pass. The reward stays locked until the studio marks the class.</aside>
<div class="phone">
  <div class="top"><span>CHEONGDAM</span><span>DAY 08</span></div>
  <div class="body" id="view"></div>
</div>
<script>
const state = { booked: false, here: false };
function row(on, title, detail) {
  return `<div class="row"><div class="box ${on ? "on" : ""}">${on ? "✓" : ""}</div><div><b>${title}</b><span>${detail}</span></div></div>`;
}
function render() {
  const done = state.booked && state.here;
  document.getElementById("view").innerHTML = `
    <p class="k">DAILY MISSION</p>
    <h1>Show up at 7</h1>
    <p class="sub">Barre · Hana Lee · Reformer 3</p>
    <div class="quest">
      ${row(state.booked, "Accept the class", state.booked ? "Booked · pass unchanged" : "7:00pm · 6 of 8 open")}
      ${row(state.here, "Check in", "6:30–6:55 · I’m here")}
      ${row(false, "Clear", "Opens when the studio marks attended")}
    </div>
    <div class="reward"><b>Reward</b><br>${done ? "Waiting on the studio. Still 2 left." : "Locked. A session is spent only after class."}</div>
    <p class="meter">PASS 2 / 10 · until 14 Oct</p>
    ${state.booked
      ? `<button id="here" ${state.here ? "disabled" : ""}>${state.here ? "Checked in" : "Check in"}</button>`
      : `<button id="accept">Accept mission</button>`}
  `;
  document.getElementById("accept")?.addEventListener("click", () => { state.booked = true; render(); });
  document.getElementById("here")?.addEventListener("click", () => { state.here = true; render(); });
}
render();
</script>
</body>
</html>
