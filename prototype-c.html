<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C · Cute mission — Capsule Barre</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --ivory:#FDFBF0; --blush:#F6B1A6; --navy:#2F3E46; --ink:#3a3330; --mute:#7d6454; --ok:#2f6f4e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:#efe6d8; color:var(--ink); font-family:"IBM Plex Sans",sans-serif; display:grid; place-items:center; padding:24px; }
  .phone { width:390px; height:844px; background:var(--ivory); border-radius:40px; box-shadow:0 24px 60px rgba(47,62,70,.18); display:flex; flex-direction:column; overflow:hidden; }
  .top { padding:26px 20px 0; display:flex; justify-content:space-between; align-items:center; }
  .pill { background:#fff; border-radius:999px; padding:8px 12px; font-weight:700; font-size:13px; }
  .body { padding:8px 20px 24px; }
  .rowline { display:flex; gap:12px; align-items:flex-end; }
  .cat { width:88px; flex:none; }
  .bubble { background:#fff; border-radius:18px 18px 18px 6px; padding:12px 14px; flex:1; box-shadow:0 8px 18px rgba(246,177,166,.28); }
  .who { color:var(--blush); font-size:11px; font-weight:700; letter-spacing:.08em; }
  .bubble p { margin:4px 0 0; font-size:15px; }
  h1 { font-size:26px; margin:18px 0 4px; letter-spacing:-.03em; }
  .sub { color:var(--mute); margin:0 0 12px; }
  .mission { background:#fff; border-radius:20px; padding:6px 14px; }
  .step { display:flex; gap:12px; align-items:center; padding:12px 0; border-top:1px solid #f0e6dc; }
  .step:first-child { border-top:0; }
  .dot { width:28px; height:28px; border-radius:50%; background:#F8E4DF; color:var(--blush); display:grid; place-items:center; font-weight:700; flex:none; }
  .dot.on { background:var(--ok); color:#fff; }
  .step b { display:block; font-size:15px; }
  .step span { color:var(--mute); font-size:12px; }
  .pass { margin-top:12px; background:#fff; border-radius:16px; padding:12px 14px; display:flex; justify-content:space-between; }
  button { width:100%; margin-top:14px; border:0; background:var(--navy); color:#FDFBF0; border-radius:999px; min-height:52px; font-weight:700; font-size:16px; }
  button:disabled { background:#e7dfd6; color:var(--mute); }
  .note { position:fixed; left:24px; top:24px; width:280px; font-size:14px; }
  .note b { display:block; margin-bottom:6px; }
  @media (max-width:900px) { .note { position:static; width:auto; margin-bottom:16px; } body { display:block; } .phone { margin:0 auto; } }
</style>
</head>
<body>
<aside class="note"><b>C · Cute + mission</b> The cat gives today’s mission. The steps are the game. The pass number waits for the studio.</aside>
<div class="phone">
  <div class="top"><div class="pill">Cheongdam ▾</div><span>🔔</span></div>
  <div class="body" id="view"></div>
</div>
<script>
const cat = `<svg class="cat" viewBox="0 0 120 110">
  <ellipse cx="60" cy="72" rx="32" ry="28" fill="#fff"/>
  <path d="M34 48 L24 18 L50 40 Z" fill="#fff"/><path d="M86 48 L96 18 L70 40 Z" fill="#fff"/>
  <circle cx="48" cy="64" r="5" fill="#2F3E46"/><circle cx="72" cy="64" r="5" fill="#2F3E46"/>
  <path d="M54 74 Q60 78 66 74" fill="none" stroke="#E05A53" stroke-width="2"/>
  <rect x="44" y="84" width="32" height="18" rx="6" fill="#2F3E46"/>
</svg>`;
const state = { booked: false, here: false };
const lines = [
  ["home", "Today’s mission is Barre at 7. Take it?"],
  ["booked", "Spot kept. Next step is showing up. Still 2 left."],
  ["here", "You’re here. I’ll tell the desk. The pass moves after class."]
];
function step(on, n, title, detail) {
  return `<div class="step"><div class="dot ${on ? "on" : ""}">${on ? "✓" : n}</div><div><b>${title}</b><span>${detail}</span></div></div>`;
}
function render() {
  const key = state.here ? "here" : state.booked ? "booked" : "home";
  const line = lines.find(l => l[0] === key)[1];
  document.getElementById("view").innerHTML = `
    <div class="rowline">${cat}<div class="bubble"><div class="who">BUTLER</div><p>${line}</p></div></div>
    <h1>Show up at 7</h1>
    <p class="sub">Yuna Choi · Reformer 3</p>
    <div class="mission">
      ${step(state.booked, "1", "Book 7:00", "Doesn’t spend a session")}
      ${step(state.here, "2", "I’m here", "6:30–6:55")}
      ${step(false, "3", "Class done", "Studio marks it · then 1 left")}
    </div>
    <div class="pass"><b>2 left</b><span>of 10 · 14 Oct</span></div>
    ${state.here ? `<button disabled>See you at 7</button>` : state.booked ? `<button id="here">I’m here</button>` : `<button id="go">Accept mission</button>`}
  `;
  document.getElementById("go")?.addEventListener("click", () => { state.booked = true; render(); });
  document.getElementById("here")?.addEventListener("click", () => { state.here = true; render(); });
}
render();
</script>
</body>
</html>
