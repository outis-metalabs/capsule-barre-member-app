<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Capsule Barre — Hana home</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#FFF8EC;--ink:#4A3B36;--mute:#8C7B72;--line:#F0E2CF;--pink:#F6A9B4;--pink-d:#E98597;--pink-l:#FDE4E8;--mint:#A8DCC4;--mint-l:#E3F4EC}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{max-width:430px;margin:0 auto;min-height:100vh;padding:12px 18px 100px;position:relative;overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;height:44px}
  .studio{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:900}
  .studio small{font-size:12px;color:var(--mute);font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 9px}
  .bell{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative}
  .bell i{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--pink-d);border:2px solid #fff}
  .date{color:var(--mute);font-size:14px;margin:0 0 10px}
  .dev{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px;padding:6px;border:1px dashed #d9c7b0;border-radius:12px;font-size:11px}
  .dev b{width:100%;color:var(--mute);font-size:10px;letter-spacing:.1em}
  .dev button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:11px}
  .dev button.on{background:var(--ink);color:#fff}
  .bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:26px;padding:14px 18px;font-size:15px;line-height:1.45;box-shadow:0 6px 0 #F3E6D3;margin:0 4px;min-height:92px;transition:opacity .25s,transform .25s}
  .bubble.swap{opacity:0;transform:translateY(6px) scale(.98)}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-13px;width:22px;height:22px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:6px}
  .bubble b{color:var(--pink-d)} .bubble .hi{font-size:17px;font-weight:900;display:block;margin-bottom:2px}
  .stage{position:relative;height:262px;margin-top:10px}
  .hana{position:absolute;left:50%;bottom:6px;width:150px;margin-left:-75px;cursor:pointer}
  .hana svg{width:100%;display:block;overflow:visible}
  .shadow{position:absolute;left:50%;bottom:4px;width:110px;height:13px;margin-left:-55px;border-radius:50%;background:rgba(120,80,60,.14)}
  #body,#head,#armL,#armR{transform-box:view-box;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
  #body{transform-origin:180px 580px} #head{transform-origin:180px 270px}
  #armL{transform-origin:110px 298px} #armR{transform-origin:250px 298px}
  .fx{opacity:0;transition:opacity .4s}
  .eye-open{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  [data-s=greet] #body{animation:bob 2.6s ease-in-out infinite}
  [data-s=greet] #armR{animation:wave 1.1s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-115deg)}50%{transform:rotate(-80deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  [data-s=warmup] #armL{transform:rotate(108deg)} [data-s=warmup] #armR{transform:rotate(-108deg)}
  [data-s=warmup] #body{animation:stretch 3s ease-in-out infinite}
  @keyframes stretch{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  [data-s=cheer] #armL{animation:cheerL .45s ease-in-out infinite alternate} [data-s=cheer] #armR{animation:cheerR .45s ease-in-out infinite alternate}
  @keyframes cheerL{from{transform:rotate(95deg)}to{transform:rotate(125deg)}} @keyframes cheerR{from{transform:rotate(-95deg)}to{transform:rotate(-125deg)}}
  [data-s=cheer] #body{animation:jump .9s cubic-bezier(.3,0,.4,1) infinite}
  @keyframes jump{0%,100%{transform:translateY(0) scale(1.04,.96)}15%{transform:translateY(0) scale(1)}45%{transform:translateY(-50px)}75%{transform:translateY(0) scale(1.05,.95)}}
  [data-s=cheer] .shadow,[data-s=streak] .shadow{animation:sh .9s infinite} @keyframes sh{45%{transform:scale(.7);opacity:.6}}
  [data-s=cheer] #fxSpark,[data-s=streak] #fxSpark{opacity:1}
  #fxSpark path{transform-box:fill-box;transform-origin:center;animation:tw 1.2s ease-in-out infinite}
  #fxSpark path:nth-child(2){animation-delay:.3s}#fxSpark path:nth-child(3){animation-delay:.6s}#fxSpark path:nth-child(4){animation-delay:.9s}
  @keyframes tw{0%,100%{transform:scale(.3);opacity:.3}50%{transform:scale(1.2) rotate(25deg);opacity:1}}
  [data-s=calm] #armL{transform:rotate(-30deg)} [data-s=calm] #armR{transform:rotate(30deg)}
  [data-s=calm] #body{animation:breathe 4.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,1.045)}}
  [data-s=calm] #fxCalm{opacity:1} #fxCalm circle{transform-box:fill-box;transform-origin:center;animation:ring 4.5s ease-out infinite}
  #fxCalm circle:nth-child(2){animation-delay:2.25s}
  @keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.4);opacity:0}}
  [data-s=streak] #armL{transform:rotate(115deg)} [data-s=streak] #armR{transform:rotate(-115deg)}
  [data-s=streak] #body{animation:jump 1.1s cubic-bezier(.3,0,.4,1) infinite}
  .confetti{position:absolute;inset:-30px 0 0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .4s}
  [data-s=streak] .confetti{opacity:1}
  .confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.4s linear infinite}
  @keyframes fall{to{transform:translateY(300px) rotate(540deg)}}
  #ticket{opacity:0;transition:opacity .4s}
  [data-s=low] #ticket{opacity:1} [data-s=low] #armL{transform:rotate(-38deg)} [data-s=low] #armR{transform:rotate(38deg)}
  [data-s=low] #body{animation:sway 3.2s ease-in-out infinite} [data-s=low] #fxSad{opacity:1}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  [data-s=nobook] #armR{animation:yawnArm 4s ease-in-out infinite}
  @keyframes yawnArm{0%,20%,80%,100%{transform:rotate(0)}35%,65%{transform:rotate(-125deg)}}
  [data-s=nobook] #head{animation:yawnHead 4s ease-in-out infinite}
  @keyframes yawnHead{0%,20%,80%,100%{transform:rotate(0)}35%,65%{transform:rotate(-6deg) translateY(-4px)}}
  [data-s=nobook] #mYawn{animation:yawn 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}
  @keyframes yawn{0%,20%,80%,100%{transform:scaleY(.3)}35%,65%{transform:scaleY(1)}}
  [data-s=sleep] #head{transform:rotate(9deg) translateY(6px)} [data-s=sleep] #body{animation:breathe 5s ease-in-out infinite}
  [data-s=sleep] #fxZ{opacity:1} #fxZ text{animation:zz 3s ease-out infinite;transform-box:fill-box}
  #fxZ text:nth-child(2){animation-delay:1s}#fxZ text:nth-child(3){animation-delay:2s}
  @keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(24px,-60px) scale(1.2)}}
  .hana.tap #body{animation:pop .4s ease}
  @keyframes pop{40%{transform:scale(1.06,.94)}}
  .prio{margin-top:6px;background:#fff;border:2px solid var(--pink);border-radius:24px;padding:12px 14px;display:flex;gap:12px;align-items:center}
  .prio .tag{font-size:11px;background:var(--pink-l);color:var(--pink-d);border-radius:99px;padding:3px 8px;display:inline-block;margin-bottom:2px}
  .prio .t{font-size:22px;font-weight:900;line-height:1.15} .prio .s{font-size:13px;color:var(--mute)}
  .prio .go{margin-left:auto;background:var(--pink-d);color:#fff;border-radius:16px;padding:12px 14px;font-weight:800;min-height:44px;white-space:nowrap}
  .prio .go.done{background:var(--mint);color:#1f5a45;cursor:default}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center}
  .stat .v{font-size:24px;font-weight:900;line-height:1.1} .stat .v small{font-size:12px;color:var(--mute)} .stat .l{font-size:12px;color:var(--mute)}
  .stat.warn{border-color:var(--pink);background:var(--pink-l)}
  nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:78px;background:#fff;border-top:1px solid var(--line);border-radius:26px 26px 0 0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 8px 8px;z-index:5}
  nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute)}
  nav button.on{color:var(--pink-d)} nav .ni{font-size:19px}
  nav .paw{width:62px;height:62px;margin:-30px auto 0;border-radius:50%;background:var(--pink);border:5px solid var(--cream);box-shadow:0 6px 14px rgba(233,133,151,.45);display:grid;place-items:center}
  .toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;border-radius:99px;padding:10px 16px;font-size:14px;transition:.3s;z-index:9;white-space:nowrap}
  .toast.show{transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}[data-s=cheer] #armL{transform:rotate(110deg)}[data-s=cheer] #armR{transform:rotate(-110deg)}[data-s=greet] #armR{transform:rotate(-100deg)}}
</style>
</head>
<body>
<div class="app">

    <div class="studio">Capsule Barre <small>Cheongdam ▾</small></div>
    <button class="bell" aria-label="Alerts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A3B36" stroke-width="2" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i></i></button>

            <ellipse cx="102" cy="214" rx="17" ry="11" fill="#F6AAB2" stroke="none" opacity=".8"/><ellipse cx="258" cy="214" rx="17" ry="11" fill="#F6AAB2" stroke="none" opacity=".8"/>

<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
/* Member data (prototype). In the real app this comes from aicc-center. */
const base={name:'Mina',now:'09:41',booking:{time:'19:00',label:'7:00pm',cls:'Barre',reformer:3},checkedIn:false,classDone:false,
  sessionsLeft:2,sessionsTotal:10,streak:6,milestone:false,daysSinceVisit:1};
/* ?state= review presets set the DATA; Hana's state is always derived from it. */
const presets={greet:{},warmup:{now:'18:20'},cheer:{now:'18:42',checkedIn:true},calm:{now:'20:05',checkedIn:true,classDone:true},
  streak:{now:'20:05',checkedIn:true,classDone:true,streak:7,milestone:true},low:{sessionsLeft:1},
  nobook:{booking:null},sleep:{booking:null,daysSinceVisit:16,streak:0}};
let m,cur;
const mins=t=>{const[h,mm]=t.split(':').map(Number);return h*60+mm};
function deriveState(m){ /* priority order */
  if(m.daysSinceVisit>=14 && !m.booking) return 'sleep';
  if(m.milestone) return 'streak';
  if(m.classDone) return 'calm';
  if(m.checkedIn) return 'cheer';
  if(!m.booking) return 'nobook';
  if(m.sessionsLeft<=1) return 'low';
  if(mins(m.booking.time)-mins(m.now)<=120) return 'warmup';
  return 'greet';
}
const face={greet:['eOpen','mOpen'],warmup:['eOpen','mSmall'],cheer:['eHappy','mOpen'],calm:['eClosed','mSmall'],
  streak:['eWink','mOpen'],low:['eSad','mSad'],nobook:['eClosed','mYawn'],sleep:['eClosed','mSmall']};
const say={
  greet:m=>`<span class="hi">Good morning, ${m.name}! 👋</span>${m.booking.cls} at <b>${m.booking.label}</b> tonight. Reformer ${m.booking.reformer} is yours. Cancel free until 4:00pm.`,
  warmup:m=>`<span class="hi">Warm-up time! 🙆‍♀️</span>Class starts at <b>${m.booking.label}</b>. Tap “I'm here” when you walk in.`,
  cheer:m=>`<span class="hi">Yay, you're here! 🎉</span>See you on Reformer ${m.booking.reformer} at <b>${m.booking.label}</b>. Still <b>${m.sessionsLeft}</b> left. The studio marks attendance.`,
  calm:m=>`<span class="hi">Breathe in… breathe out… 🌿</span>Lovely class, ${m.name}. That's day <b>${m.streak}</b> of your streak.`,
  streak:m=>`<span class="hi">${m.streak}-day streak! 🎊</span>A whole week of Barre, ${m.name}. Hana is so proud of you.`,
  low:m=>`<span class="hi">Only <b>${m.sessionsLeft}</b> session left… 🎟️</span>Your pass runs until 14 Oct. Want to ask the studio about extending?`,
  nobook:m=>`<span class="hi">*yawn* Nothing booked today…</span>There's still a spot at Cheongdam <b>7:00pm</b>. Shall we go?`,
  sleep:m=>`<span class="hi">Zzz… 💤</span>It's been <b>${m.daysSinceVisit} days</b>. Hana misses class with you. Book one to wake her up!`};
const ALL=['eOpen','eWink','eHappy','eClosed','eSad','mSmall','mOpen','mSad','mYawn'];
const fmt=t=>{let[h,mm]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')}${ap}`};
function render(){
  const s=deriveState(m);
  $('#date').textContent='Thursday, 8 October · '+fmt(m.now);
  if(s!==cur){
    const b=$('#bubble'),first=!cur; b.classList.add('swap');
    setTimeout(()=>{b.innerHTML=say[s](m);b.classList.remove('swap')},first?0:220);
    document.body.dataset.s=s; ALL.forEach(id=>$('#'+id).style.display=face[s].includes(id)?'':'none');
    $('#hana').setAttribute('aria-label','Hana the cat, '+s); cur=s;
  }
  $('#vSess').innerHTML=`${m.sessionsLeft}<small> / ${m.sessionsTotal}</small>`; $('#stSess').classList.toggle('warn',m.sessionsLeft<=1);
  $('#vStreak').textContent=m.streak;
  const p=$('#prio');
  if(!m.booking) p.innerHTML=`<div><span class="tag">Open today</span><div class="t">7:00pm</div><div class="s">Barre · Cheongdam · 6 of 8</div></div><button class="go" id="act">Book</button>`;
  else if(m.classDone) p.innerHTML=`<div><span class="tag">Done today</span><div class="t">${m.booking.cls}</div><div class="s">Cheongdam · ${m.sessionsLeft} left</div></div><button class="go done" disabled>Done ✓</button>`;
  else p.innerHTML=`<div><span class="tag">Today's class</span><div class="t">${m.booking.label}</div><div class="s">${m.booking.cls} · Reformer ${m.booking.reformer} · Cheongdam</div></div>`+
    (m.checkedIn?`<button class="go done" disabled>You're here</button>`:`<button class="go" id="act">I'm here</button>`);
  const a=$('#act'); if(a) a.onclick=()=>{
    if(!m.booking){m.booking={...base.booking};m.daysSinceVisit=0;toast('Booked · Thu 7:00pm');}
    else{m.checkedIn=true;if(m.now<'18:30')m.now='18:42';}
    render();
  };
  confetti(s==='streak');
}
function confetti(on){const c=$('#confetti');if(!on||c.childElementCount)return;const cols=['#F6A9B4','#A8DCC4','#F5C26B','#BFD7F2','#E98597'];
  for(let i=0;i<22;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%5];e.style.animationDelay=(-Math.random()*2.4)+'s';e.style.animationDuration=(1.8+Math.random())+'s';c.append(e)}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}
$('#hana').onclick=()=>{const h=$('#hana'),f=face[cur];if(cur==='sleep'){toast('Shh… Hana is napping 💤');return}
  f.forEach(id=>{if(id[0]==='e')$('#'+id).style.display='none'});$('#eWink').style.display='';h.classList.add('tap');
  setTimeout(()=>{$('#eWink').style.display=f.includes('eWink')?'':'none';f.forEach(id=>$('#'+id).style.display='');h.classList.remove('tap')},650)};
const q=new URLSearchParams(location.search), st=q.get('state');
function load(name){m=JSON.parse(JSON.stringify(base));Object.assign(m,presets[name]||{});cur=null;render();
  document.querySelectorAll('.dev button').forEach(b=>b.classList.toggle('on',b.textContent===name))}
if(st!==null||q.has('dev')){const d=$('#dev');d.hidden=false;Object.keys(presets).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{history.replaceState(null,'','?state='+k);load(k)};d.append(b)})}
load(presets[st]?st:'greet');
</script>
</body>
</html>
