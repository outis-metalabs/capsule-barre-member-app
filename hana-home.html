<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Capsule Barre — Hana board</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* GAME_DESIGN visual system: ivory, blush, navy, red-orange button */
  :root{--ivory:#F7F1EA;--blush:#F6B1A6;--navy:#2F3E46;--red:#E05A53;--mute:#7A7068;--line:#E8DDD0;--mint:#B5E0CB;--ok:#1f5a45;--ok-bg:#DDF1E6;--pink:#F5B5BD}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--ivory);color:var(--navy);font-family:Nunito,system-ui,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{max-width:430px;margin:0 auto;min-height:100vh;padding:10px 18px 96px;position:relative;overflow-x:hidden}
  header{display:flex;align-items:center;justify-content:space-between;height:44px}
  .studio{display:flex;align-items:center;gap:4px;font-size:21px;font-weight:900;min-height:44px}
  .studio span{font-size:14px;color:var(--mute)}
  .bell{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;position:relative}
  .bell i{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
  .pass{font-size:14px;color:var(--mute);min-height:32px;display:flex;align-items:center;gap:6px}
  .pass b{color:var(--navy)} .pass.warn b{color:var(--red)}
  .day{font-size:13px;letter-spacing:.12em;font-weight:900;border:2px solid var(--navy);border-radius:10px;padding:3px 9px}
  .hint{display:block;width:100%;text-align:left;background:#fff;border:1px dashed var(--blush);border-radius:14px;padding:9px 12px;font-size:13px;margin:0 0 6px;min-height:40px}
  .hint b{color:var(--red)}
  .dev{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px;padding:6px;border:1px dashed #cdbfae;border-radius:12px}
  .dev b{width:100%;color:var(--mute);font-size:10px;letter-spacing:.1em}
  .dev button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:11px}
  .dev button.on{background:var(--navy);color:#fff} .dev button.act{border-color:var(--red);color:var(--red)}
  /* stage + pill */
  .stage{position:relative;height:214px;pointer-events:none}
  .pill{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;border:2px solid var(--navy);border-radius:99px;padding:8px 16px;font-size:15px;white-space:nowrap;box-shadow:0 4px 0 var(--blush);transition:opacity .25s,transform .25s;z-index:2}
  .pill:after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:translateX(-50%) rotate(45deg)}
  .pill.swap{opacity:0;transform:translate(-50%,6px)}
  .hana{position:absolute;left:50%;bottom:4px;width:138px;margin-left:-69px;cursor:pointer;pointer-events:auto}
  .hana svg{width:100%;display:block;overflow:visible}
  .hana svg .fx{pointer-events:none}
  .shadow{position:absolute;left:50%;bottom:2px;width:100px;height:12px;margin-left:-50px;border-radius:50%;background:rgba(47,62,70,.12)}
  #body,#head,#armL,#armR{transform-box:view-box;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
  #body{transform-origin:180px 540px} #head{transform-origin:180px 270px}
  #armL{transform-origin:112px 296px} #armR{transform-origin:248px 296px}
  .fx{opacity:0;transition:opacity .4s}
  .eye-open{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,1.04)}}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  /* greet: wave */
  [data-s=greet] #body{animation:bob 2.6s ease-in-out infinite}
  [data-s=greet] #armR{animation:wave 1.1s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-112deg)}50%{transform:rotate(-80deg)}}
  /* warmup: overhead side stretch */
  [data-s=warmup] #armL{transform:rotate(108deg)} [data-s=warmup] #armR{transform:rotate(-108deg)}
  [data-s=warmup] #body{animation:stretch 3s ease-in-out infinite}
  @keyframes stretch{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  /* cheer: three hops then still (the "You're here" moment rises once and stops) */
  [data-s=cheer] #armL{transform:rotate(112deg)} [data-s=cheer] #armR{transform:rotate(-112deg)}
  [data-s=cheer] #body{animation:jump .8s cubic-bezier(.3,0,.4,1) 3}
  @keyframes jump{0%,100%{transform:translateY(0) scale(1.04,.96)}15%{transform:translateY(0) scale(1)}45%{transform:translateY(-36px)}75%{transform:translateY(0) scale(1.04,.96)}}
  [data-s=cheer] #fxSpark{opacity:1}
  #fxSpark path{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
  #fxSpark path:nth-child(2){animation-delay:.35s}#fxSpark path:nth-child(3){animation-delay:.7s}#fxSpark path:nth-child(4){animation-delay:1.05s}
  @keyframes tw{0%,100%{transform:scale(.3);opacity:.3}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
  /* calm: meditate */
  [data-s=calm] #armL,[data-s=paused] #armL{transform:rotate(-30deg)} [data-s=calm] #armR,[data-s=paused] #armR{transform:rotate(30deg)}
  [data-s=calm] #body,[data-s=paused] #body{animation:breathe 4.5s ease-in-out infinite}
  [data-s=calm] #fxCalm{opacity:1} #fxCalm circle{transform-box:fill-box;transform-origin:center;animation:ring 4.5s ease-out infinite}
  #fxCalm circle:nth-child(2){animation-delay:2.25s}
  @keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.35);opacity:0}}
  /* streak milestone: one quiet bounce, no confetti */
  [data-s=streak] #armL{transform:rotate(-30deg)} [data-s=streak] #armR{transform:rotate(30deg)}
  [data-s=streak] #body{animation:qbounce .9s ease-out 1}
  @keyframes qbounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}60%{transform:translateY(0) scale(1.03,.97)}}
  /* low: paws together, gentle sway */
  [data-s=low] #armL{transform:rotate(-36deg)} [data-s=low] #armR{transform:rotate(36deg)}
  [data-s=low] #body{animation:sway 3.4s ease-in-out infinite}
  /* nobook: sleepy, small yawn with a paw */
  [data-s=nobook] #armR{animation:yawnArm 5s ease-in-out infinite}
  @keyframes yawnArm{0%,25%,75%,100%{transform:rotate(0)}40%,60%{transform:rotate(-58deg)}}
  [data-s=nobook] #mYawn{animation:yawn 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}
  @keyframes yawn{0%,25%,75%,100%{transform:scale(.55,.4)}40%,60%{transform:scale(1)}}
  [data-s=nobook] #body{animation:breathe 4s ease-in-out infinite}
  /* sleep: nap */
  [data-s=sleep] #head{transform:rotate(8deg) translateY(5px)} [data-s=sleep] #body{animation:breathe 5s ease-in-out infinite}
  [data-s=sleep] #fxZ{opacity:1} #fxZ text{animation:zz 3s ease-out infinite;transform-box:fill-box}
  #fxZ text:nth-child(2){animation-delay:1s}#fxZ text:nth-child(3){animation-delay:2s}
  @keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(24px,-56px) scale(1.2)}}
  .hana.tap #body{animation:pop .4s ease}
  @keyframes pop{40%{transform:scale(1.05,.95)}}
  /* ticket */
  .ticket{position:relative;background:#fff;border:2px solid var(--navy);border-radius:24px;padding:14px 16px 16px;box-shadow:0 6px 0 var(--blush);
    -webkit-mask:radial-gradient(circle 13px at 0 46px,transparent 12px,#000 13px);mask:radial-gradient(circle 13px at 0 46px,transparent 12px,#000 13px)}
  .beads{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 12px 6px}
  .bead{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);position:relative}
  .bead i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff;z-index:1}
  .bead.done i{background:var(--red);border-color:var(--red)} .bead.cur i{border:4px solid var(--blush)} .bead.cur{color:var(--navy)}
  .bead:not(:last-child):after{content:"";position:absolute;top:8px;left:calc(50% + 10px);right:calc(-50% + 10px);height:2px;background:var(--line)}
  .bead.done:not(:last-child):after{background:var(--red)}
  .cls{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
  .cls .t{font-size:30px;font-weight:900;line-height:1}
  .cls .s{font-size:13px;color:var(--mute);margin-top:4px}
  .cls .now{text-align:right;font-size:12px;color:var(--mute)} .cls .now b{font-size:22px;color:var(--navy);display:block;line-height:1}
  .dead{font-size:12px;color:var(--mute);margin-top:8px}
  .dead.late{color:var(--red)}
  .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{flex:1;min-height:48px;border-radius:16px;font-weight:800;font-size:15px;padding:0 12px}
  .btn.p{background:var(--red);color:#fff} .btn.s{border:2px solid var(--navy);background:#fff} .btn.t{flex:0 0 auto;color:var(--red);min-height:44px}
  .ok{width:100%;background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:800;display:flex;align-items:center;gap:8px;animation:rise .5s ease-out 1}
  @keyframes rise{from{transform:translateY(8px);opacity:0}}
  .note{width:100%;font-size:13px;color:var(--mute);text-align:center}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(47,62,70,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--ivory);width:100%;max-width:430px;border-radius:26px 26px 0 0;padding:18px 18px 28px;animation:up .3s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .sheet h3{margin:0 0 4px;font-size:20px} .sheet .sub{color:var(--mute);font-size:13px;margin:0 0 12px}
  .row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;min-height:56px;width:100%;text-align:left}
  .row small{display:block;color:var(--mute);font-size:12px}
  .tag{font-size:12px;border-radius:99px;padding:4px 10px;background:var(--ok-bg);color:var(--ok)} .tag.full{background:#eee;color:var(--mute)}
  .pads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
  .pad{min-height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px}
  .pad[disabled]{background:#eee;color:#aaa;cursor:default} .pad.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .card{background:#fff;border:2px solid var(--navy);border-radius:20px;padding:16px;margin-bottom:12px}
  .card .k{font-size:12px;color:var(--red);letter-spacing:.1em} .card .big{font-size:22px;font-weight:900}
  nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:76px;background:#fff;border-top:1px solid var(--line);border-radius:24px 24px 0 0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 8px 8px;z-index:5}
  nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);min-height:44px;justify-content:center}
  nav button.on{color:var(--red)} nav .ni{font-size:19px}
  nav .paw{width:60px;height:60px;margin:-30px auto 0;border-radius:50%;background:var(--blush);border:5px solid var(--ivory);box-shadow:0 6px 14px rgba(224,90,83,.3);display:grid;place-items:center}
  .toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--navy);color:#fff;border-radius:99px;padding:10px 16px;font-size:14px;transition:.3s;z-index:30;white-space:nowrap}
  .toast.show{transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="studio" id="studioBtn" aria-label="Switch studio"><b id="studioName"></b><span>▾</span></button>
    <button class="bell" aria-label="Alerts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F3E46" stroke-width="2" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i></i></button>
  </header>
  <div class="meta">
    <button class="pass" id="passLine"></button>
    <span class="day" id="day"></span>
  </div>
  <button class="hint" id="hint" hidden></button>
  <div class="dev" id="dev" hidden><b>REVIEW ONLY · ?state=</b></div>

  <div class="stage">
    <div class="pill" id="pill" aria-live="polite"></div>
    <div class="shadow"></div>
    <div class="hana" id="hana" role="img" aria-label="Hana the cat">
      <!-- Hana, front pose, traced from the style guide (viewBox 360x560, ~2.2 heads tall). -->
      <svg viewBox="0 0 360 560" aria-hidden="true">
        <g id="fxCalm" class="fx" fill="none" stroke="#B5E0CB" stroke-width="4"><circle cx="180" cy="300" r="165"/><circle cx="180" cy="300" r="165"/></g>
        <g id="body" stroke="#3B2E29" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
          <!-- tail: cream, grey tip, peeks out on her left -->
          <path d="M250 470C300 472 318 426 300 392" fill="none" stroke-width="26"/>
          <path d="M250 470C300 472 318 426 300 392" fill="none" stroke="#F8EFD9" stroke-width="18"/>
          <path d="M306 410C304 402 302 396 300 392" fill="none" stroke="#A9A5A3" stroke-width="18"/>
          <!-- feet + leggings -->
          <ellipse cx="136" cy="528" rx="31" ry="17" fill="#F8EFD9"/><ellipse cx="224" cy="528" rx="31" ry="17" fill="#F8EFD9"/>
          <path d="M136 524v-8M224 524v-8" stroke-width="2.5"/>
          <path d="M96 398H264C268 430 262 480 256 516H194L184 452H176L166 516H104C98 480 92 430 96 398Z" fill="#F5B5BD"/>
          <path d="M98 406C96 440 100 480 104 514H114C110 480 106 440 108 406Z" fill="#B5E0CB" stroke="none"/>
          <path d="M262 406C264 440 260 480 256 514H246C250 480 254 440 252 406Z" fill="#B5E0CB" stroke="none"/>
          <path d="M96 398H264C268 430 262 480 256 516H194L184 452H176L166 516H104C98 480 92 430 96 398Z" fill="none"/>
          <!-- torso: round -->
          <path d="M136 262C118 278 96 296 96 330C96 360 98 380 100 400H260C262 380 264 360 264 330C264 296 242 278 224 262Z" fill="#F8EFD9"/>
          <rect x="96" y="390" width="168" height="12" rx="5" fill="#B5E0CB"/>
          <path d="M108 286C122 280 132 274 138 270C150 302 210 302 222 270C228 274 238 280 252 286C258 306 258 330 256 346H104C102 330 102 306 108 286Z" fill="#F5B5BD"/>
          <rect x="102" y="342" width="156" height="12" rx="5" fill="#B5E0CB"/>
          <!-- head -->
          <g id="head">
            <clipPath id="hc"><path d="M180 272C110 272 52 245 46 190C42 150 50 115 62 95L66 42Q68 26 84 34L128 62C160 52 200 52 232 62L276 34Q292 26 294 42L298 95C310 115 318 150 314 190C308 245 250 272 180 272Z"/></clipPath>
            <path d="M180 272C110 272 52 245 46 190C42 150 50 115 62 95L66 42Q68 26 84 34L128 62C160 52 200 52 232 62L276 34Q292 26 294 42L298 95C310 115 318 150 314 190C308 245 250 272 180 272Z" fill="#F8EFD9" stroke="none"/>
            <path clip-path="url(#hc)" d="M200 30C196 92 236 140 322 150V0H200Z" fill="#A9A5A3" stroke="none"/>
            <path d="M78 44L116 66Q94 78 82 100Z" fill="#F4AEB8" stroke="none"/>
            <path d="M282 44L244 66Q266 78 278 100Z" fill="#F4AEB8" stroke="none"/>
            <path d="M180 272C110 272 52 245 46 190C42 150 50 115 62 95L66 42Q68 26 84 34L128 62C160 52 200 52 232 62L276 34Q292 26 294 42L298 95C310 115 318 150 314 190C308 245 250 272 180 272Z" fill="none"/>
            <ellipse cx="102" cy="214" rx="17" ry="11" fill="#F4AEB8" stroke="none" opacity=".85"/><ellipse cx="258" cy="214" rx="17" ry="11" fill="#F4AEB8" stroke="none" opacity=".85"/>
            <path d="M54 198L16 192M54 210L18 220M306 198L344 192M306 210L342 220" stroke-width="3.5"/>
            <!-- eyes: open (guide), wink (guide), closed (guide), sleepy half-lid (extension, same line language) -->
            <g id="eOpen" stroke="none"><g class="eye-open"><ellipse cx="122" cy="176" rx="22" ry="23" fill="#2A1F1B"/><circle cx="129" cy="168" r="8" fill="#fff"/><circle cx="114" cy="184" r="3" fill="#fff"/></g><g class="eye-open"><ellipse cx="234" cy="176" rx="22" ry="23" fill="#2A1F1B"/><circle cx="241" cy="168" r="8" fill="#fff"/><circle cx="226" cy="184" r="3" fill="#fff"/></g><path d="M101 166L92 160M104 158L98 150M255 166L264 160M252 158L258 150" stroke="#2A1F1B" stroke-width="3.5"/></g>
            <g id="eWink"><g class="eye-open" stroke="none"><ellipse cx="122" cy="176" rx="22" ry="23" fill="#2A1F1B"/><circle cx="129" cy="168" r="8" fill="#fff"/><circle cx="114" cy="184" r="3" fill="#fff"/></g><path d="M101 166L92 160M104 158L98 150" stroke="#2A1F1B" stroke-width="3.5"/><path d="M214 180Q234 160 254 180M256 172L264 166" fill="none" stroke="#2A1F1B" stroke-width="5"/></g>
            <g id="eClosed" fill="none" stroke="#2A1F1B" stroke-width="5"><path d="M102 176Q122 194 142 176M214 176Q234 194 254 176"/><path d="M100 176L91 172M256 176L265 172" stroke-width="3.5"/></g>
            <path d="M171 194Q178 190 186 194Q182 203 178 204Q174 203 171 194Z" fill="#E8909C" stroke-width="2.5"/>
            <path id="mSmall" d="M162 209Q170 220 178 209Q186 220 194 209" fill="none" stroke-width="4"/>
            <g id="mOpen"><path d="M160 208Q178 212 196 208Q194 236 178 236Q162 236 160 208Z" fill="#C85A6E" stroke-width="4"/><path d="M168 228Q178 220 188 228Q184 234 178 234Q172 234 168 228Z" fill="#F4A3B0" stroke="none"/></g>
            <path id="mYawn" d="M168 210Q178 213 188 210Q187 228 178 228Q169 228 168 210Z" fill="#C85A6E" stroke-width="3.5"/>
          </g>
          <!-- arms: plump, rounded paws; grey spot on viewer's-left arm, small one on the other shoulder -->
          <g id="armL"><path d="M118 282C86 296 52 338 26 376C12 398 34 422 56 408C72 396 96 376 116 360Z" fill="#F8EFD9"/><ellipse cx="74" cy="334" rx="12" ry="16" transform="rotate(40 74 334)" fill="#A9A5A3" stroke="none"/></g>
          <g id="armR"><path d="M242 282C274 296 308 338 334 376C348 398 326 422 304 408C288 396 264 376 244 360Z" fill="#F8EFD9"/><ellipse cx="262" cy="304" rx="7" ry="9" fill="#A9A5A3" stroke="none"/></g>
        </g>
        <g id="fxSpark" class="fx" fill="#F5C26B"><path d="M20 120l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/><path fill="#F6B1A6" d="M340 90l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><path fill="#B5E0CB" d="M30 320l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path d="M335 300l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/></g>
        <g id="fxZ" class="fx" font-family="Nunito" font-weight="900" fill="#8E86A8"><text x="300" y="70" font-size="34">z</text><text x="318" y="48" font-size="27">z</text><text x="334" y="26" font-size="22">Z</text></g>
      </svg>
    </div>
  </div>

  <section class="ticket" id="ticket"></section>
</div>
<nav>
  <button class="on"><span class="ni">🏠</span>Board</button>
  <button><span class="ni">🗓️</span>Schedule</button>
  <button class="paw" aria-label="Talk to Hana"><svg width="30" height="30" viewBox="0 0 40 40" fill="#fff"><ellipse cx="20" cy="27" rx="10" ry="8"/><ellipse cx="9" cy="17" rx="4" ry="5"/><ellipse cx="16" cy="10" rx="4" ry="5"/><ellipse cx="24" cy="10" rx="4" ry="5"/><ellipse cx="31" cy="17" rx="4" ry="5"/></svg></button>
  <button><span class="ni">🎟️</span>Pass</button>
  <button><span class="ni">🙂</span>Me</button>
</nav>
<div id="sheetHost"></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
/* Member data (prototype; in the app every value comes from aicc-center). Today is Thu 8 Oct. */
const CLASS={time:'19:00',label:'7:00pm',cls:'Barre',teacher:'Hana Lee',deadline:'16:00'};
const base={name:'Mina',now:'09:41',cur:'cheongdam',streak:6,daysSinceVisit:1,
  studios:{
    cheongdam:{name:'Cheongdam',remaining:2,afterClass:1,total:10,until:'14 Oct',daysToExpiry:6,booking:{...CLASS,reformer:3},presence:false,shareHere:false,attended:false,cleared:false},
    geumho:{name:'Geumho',remaining:8,afterClass:8,total:20,until:'12 Nov',daysToExpiry:35,booking:null,presence:false,shareHere:false,attended:false,cleared:false}}};
/* Review presets change the DATA only; Hana's state is always derived. */
const healthy={remaining:6,afterClass:5,until:'12 Nov',daysToExpiry:35};
const presets={
  greet:{c:healthy},
  low:{},
  warmup:{now:'17:40',c:healthy},
  arrive:{now:'18:40',c:healthy},
  cheer:{now:'18:44',c:{...healthy,presence:true}},
  calm:{now:'20:05',c:{...healthy,remaining:5,presence:true,shareHere:true,attended:true}},
  streak:{now:'20:06',streak:7,c:{...healthy,remaining:5,presence:true,shareHere:true,attended:true,cleared:true}},
  paused:{now:'19:10',c:healthy},
  nobook:{c:{booking:null}},
  sleep:{daysSinceVisit:16,streak:0,c:{booking:null}}};
let m,cur;
const S=()=>m.studios[m.cur];
const mins=t=>{const[h,mm]=t.split(':').map(Number);return h*60+mm};
const fmt=t=>{let[h,mm]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')}${ap}`};
const isLow=s=>s.remaining<=3||s.daysToExpiry<=7;              /* FLOWS T5 */
const inWindow=()=>mins(m.now)>=mins('18:30')&&mins(m.now)<=mins('18:55'); /* BA R13 */
function deriveState(){
  const s=S();
  if(!s.booking) return m.daysSinceVisit>=14?'sleep':'nobook';
  if(s.attended) return (s.cleared&&m.streak>0&&m.streak%7===0)?'streak':'calm'; /* milestone derived from streak */
  if(s.presence) return 'cheer';
  if(mins(m.now)>mins('18:55')) return 'paused';
  if(mins(m.now)>=mins('17:00')) return 'warmup';
  if(isLow(s)) return 'low';
  return 'greet';
}
const face={greet:['eOpen','mOpen'],warmup:['eOpen','mSmall'],cheer:['eOpen','mOpen'],calm:['eClosed','mSmall'],paused:['eOpen','mSmall'],
  streak:['eWink','mSmall'],low:['eOpen','mSmall'],nobook:['eClosed','mYawn'],sleep:['eClosed','mSmall']};
function line(st){const s=S();return{
  greet:`Morning, ${m.name}. See you at 7.`,
  low:`${s.remaining} left · pass ends ${s.until}.`,
  warmup:inWindow()?`Check-in is open. Say you're here.`:`Warm up. Check-in opens 6:30.`,
  cheer:`You're here · see you at 7.`,
  calm:s.cleared?`Board cleared. Rest well.`:`Done · Barre. Share or skip to clear.`,
  streak:`Day ${m.streak}. Board cleared. Rest well.`,
  paused:`Board paused. Tomorrow is a new level.`,
  nobook:`Tonight's board is open.`,
  sleep:`Nothing on the board. Want a seat?`}[st]}
const ALL=['eOpen','eWink','eClosed','mSmall','mOpen','mYawn'];
function render(){
  const s=S(), st=deriveState();
  $('#studioName').textContent=s.name;
  const pl=$('#passLine'); pl.innerHTML=`${s.name} · <b>${s.remaining} left</b> · until ${s.until}`; pl.classList.toggle('warn',isLow(s));
  $('#day').textContent='DAY '+m.streak;
  const other=Object.entries(m.studios).find(([k,v])=>k!==m.cur&&v.booking&&!v.attended);
  const h=$('#hint'); h.hidden=!other;
  if(other){h.innerHTML=`You have class at <b>${other[1].name} · ${other[1].booking.label}</b> today →`;h.onclick=()=>switchStudio(other[0]);}
  const txt=line(st), p=$('#pill');
  if(st!==cur||p.textContent!==txt){
    p.classList.add('swap'); setTimeout(()=>{p.textContent=txt;p.classList.remove('swap')},cur?200:0);
  }
  if(st!==cur){document.body.dataset.s=st; ALL.forEach(id=>$('#'+id).style.display=face[st].includes(id)?'':'none');
    $('#hana').setAttribute('aria-label','Hana the cat, '+st); cur=st;}
  ticket(st);
}
function bead(n,label,done,curr){return `<div class="bead ${done?'done':curr?'cur':''}"><i></i>${label}</div>`}
function ticket(st){
  const s=S(), b=s.booking, t=$('#ticket');
  const steps=[!!b,s.presence,s.shareHere,s.cleared]; const ci=steps.indexOf(false);
  let h=`<div class="beads">${['Pick','Arrive','Share here','Clear'].map((l,i)=>bead(i,l,steps[i],i===ci&&st!=='paused')).join('')}</div>`;
  if(!b){
    h+=`<div class="cls"><div><div class="t">Empty</div><div class="s">Tonight at ${s.name}: 7:00pm Barre · 6 of 8 open</div></div></div>
        <div class="acts"><button class="btn p" id="find">Find a class</button></div>`;
  } else {
    const after=s.afterClass; /* server value (BA R3/F6), never computed on the phone */
    h+=`<div class="cls"><div><div class="t">${b.label}</div><div class="s">${b.cls} · ${b.teacher} · Reformer ${b.reformer}</div></div>
        <div class="now">${s.attended?'Now':'Now · after class'}<b>${s.attended?s.remaining:s.remaining+' · '+after}</b></div></div>`;
    const late=mins(m.now)>=mins(b.deadline);
    if(s.attended&&s.cleared) h+=`<div class="acts"><div class="ok">✓ Board cleared · streak day ${m.streak}</div><button class="btn t">Open schedule</button></div>`;
    else if(s.attended) h+=`<div class="acts"><div class="ok">✓ Done · Barre with ${b.teacher}</div><button class="btn p" id="shareRes">Share result</button><button class="btn s" id="skipRes">Skip</button></div>`;
    else if(s.presence) h+=`<div class="acts"><div class="ok">✓ You're here · see you at 7 · still ${s.remaining} left</div>`+
        (s.shareHere?`<div class="note">The studio marks attendance after class.</div>`:`<button class="btn s" id="shareHere">Share check-in</button><button class="btn t" id="skipHere">Not now</button>`)+`</div>`;
    else if(st==='paused') h+=`<div class="dead late">Check-in closed at 6:55pm. Streak unchanged.</div><div class="acts"><button class="btn s" id="ask">Ask the studio</button></div>`;
    else if(inWindow()) h+=`<div class="dead">Check-in open 6:30–6:55pm · your reformer is held until 6:45pm</div><div class="acts"><button class="btn p" id="here">I'm here</button></div>`;
    else {
      h+=`<div class="dead ${late?'late':''}">${late?'Free cancel ended · contact the studio':'Free cancel until 4:00pm'} · check-in opens 6:30pm</div>
          <div class="acts"><button class="btn s" id="move">Change time</button>`+(late?`<button class="btn s" id="ask">Ask the studio</button>`:`<button class="btn s" id="cancel">Cancel free</button>`)+`</div>`+
          (isLow(s)?`<div class="acts"><button class="btn t" id="extend" style="flex:1">${s.remaining} left · ends ${s.until} · Ask about extending →</button></div>`:'');
    }
  }
  t.innerHTML=h;
  const on=(id,f)=>{const e=$('#'+id); if(e) e.onclick=f};
  on('find',openBook);
  on('here',()=>{s.presence=true;render();});
  on('shareHere',()=>shareSheet('here'));
  on('skipHere',()=>{s.shareHere=true;render();});
  on('shareRes',()=>shareSheet('result'));
  on('skipRes',()=>clearBoard());
  on('move',()=>toast('Change time · one move, never cancel + rebook'));
  on('ask',()=>requestSheet('question'));
  on('extend',()=>requestSheet('extend'));
  on('cancel',cancelSheet);
}
function clearBoard(){const s=S();s.cleared=true;m.streak+=1;render();}  /* streak grows only when the board clears */
/* sheets */
function sheet(html){$('#sheetHost').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog">${html}</div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close()};}
function close(){$('#sheetHost').innerHTML=''}
function openBook(){ /* S8 list → S10 reformer pick; never books instantly */
  const s=S();
  sheet(`<h3>Book · ${s.name}</h3><p class="sub">Thu 8 Oct · booking does not use a session</p>
    <button class="row" id="open7"><span>7:00pm Barre<small>${CLASS.teacher} · 6 of 8 · free cancel until 4:00pm</small></span><span class="tag">Open</span></button>
    <button class="row" id="full8"><span>8:00pm Barre<small>${CLASS.teacher} · 8 of 8 · you'd be 2nd</small></span><span class="tag full">Full · waitlist</span></button>
    <button class="btn t" id="x">Not now</button>`);
  $('#x').onclick=close;
  $('#full8').onclick=()=>{sheet(`<h3>Join the 8:00pm waitlist?</h3><p class="sub">You'd be 2nd. A seat is never held for you; if one opens we ask first, and you have 30 minutes to take it.</p>
    <div class="acts"><button class="btn p" id="wj">Join waitlist</button><button class="btn s" id="wb">Back</button></div>`);
    $('#wb').onclick=openBook; $('#wj').onclick=()=>{close();toast("On the waitlist · you're 2nd")};};
  $('#open7').onclick=()=>{
    let pick=null;
    sheet(`<h3>Pick your reformer</h3><p class="sub">7:00pm Barre · yours until 6:45pm · no names shown</p>
      <div class="pads">${[1,2,3,4,5,6].map(n=>`<button class="pad" data-n="${n}" ${n===2||n===5?'disabled':''}>${n}${n===2||n===5?' · taken':''}</button>`).join('')}</div>
      <div class="acts"><button class="btn s" id="lock" disabled>Pick a reformer</button></div><button class="btn t" id="x">Back</button>`);
    $('#x').onclick=openBook;
    document.querySelectorAll('.pad:not([disabled])').forEach(b=>b.onclick=()=>{pick=+b.dataset.n;document.querySelectorAll('.pad').forEach(x=>x.classList.toggle('on',x===b));const l=$('#lock');l.disabled=false;l.className='btn p';l.textContent='Lock spot '+pick});
    $('#lock').onclick=()=>{if(!pick)return;s.booking={...CLASS,reformer:pick};m.daysSinceVisit=0;close();toast(`Booked · reformer ${pick} · see you at 7`);render();};
  };
}
function cancelSheet(){
  sheet(`<h3>Cancel 7:00pm Barre?</h3><p class="sub">Free until 4:00pm. You keep ${S().remaining} sessions.</p>
    <div class="acts"><button class="btn p" id="keep">Keep it</button><button class="btn s" id="cx">Cancel class</button></div>`);
  $('#keep').onclick=close; $('#cx').onclick=()=>{const s=S();s.booking=null;close();toast('Cancelled · still '+s.remaining+' left');render();};
}
function shareSheet(kind){
  const s=S(), b=s.booking;
  const card=kind==='here'?`<div class="card"><div class="k">I'M AT ${s.name.toUpperCase()}</div><div class="big">${b.label} ${b.cls}</div><div>${b.teacher} · Thu 8 Oct</div></div>`
    :`<div class="card"><div class="k">DONE</div><div class="big">${b.cls}</div><div>${b.teacher} · ${s.name} · Thu 8 Oct</div></div>`;
  sheet(`<h3>${kind==='here'?'Share check-in':'Share result'}</h3><p class="sub">No pass or sessions on the card.</p>${card}
    <div class="acts"><button class="btn p" id="sh">Share</button><button class="btn s" id="nn">${kind==='here'?'Not now':'Skip'}</button></div>`);
  const done=()=>{close(); if(kind==='here'){s.shareHere=true;render();} else clearBoard();};
  $('#sh').onclick=()=>{toast('Phone share sheet · Messages, KakaoTalk, Instagram, Copy');done();};
  $('#nn').onclick=done;
}
function switchStudio(k){m.cur=k;close();cur=null;render();}
$('#studioBtn').onclick=()=>{
  sheet(`<h3>Studios</h3><p class="sub">Each studio has its own pass. Balances are never merged.</p>`+
    Object.entries(m.studios).map(([k,v])=>`<button class="row" data-k="${k}"><span>${v.name}<small>${v.remaining} of ${v.total} · until ${v.until}</small></span><span class="tag ${k===m.cur?'':'full'}">${k===m.cur?'Here':'Train here'}</span></button>`).join(''));
  document.querySelectorAll('.row[data-k]').forEach(r=>r.onclick=()=>switchStudio(r.dataset.k));
};
$('#passLine').onclick=()=>{const s=S();
  sheet(`<h3>Pass · ${s.name}</h3><p class="sub">Separate from other studios.</p><div class="card"><div class="k">REMAINING</div><div class="big">${s.remaining} of ${s.total}</div><div>Until ${s.until}</div></div>
    <div class="acts"><button class="btn s" id="rq">Ask about extending</button></div><button class="btn t" id="x">Close</button>`);
  $('#rq').onclick=()=>requestSheet('extend'); $('#x').onclick=close;};
function requestSheet(kind){ /* F26/F30: request goes to the owner; the pass is unchanged until they act */
  const s=S();
  sheet(`<h3>Ask ${s.name}</h3><p class="sub">The studio replies in Alerts. Your pass still ends ${s.until} until they act.</p>
    <div class="acts" id="kinds">${['extend','hold','question'].map(k=>`<button class="btn s" data-k="${k}" style="${k===kind?'background:#2F3E46;color:#fff':''}">${{extend:'Extend',hold:'Hold',question:'Question'}[k]}</button>`).join('')}</div>
    <textarea id="msg" rows="3" style="width:100%;margin-top:10px;border-radius:14px;border:1px solid #E8DDD0;padding:10px;font:inherit" placeholder="Anything to add? (optional)"></textarea>
    <div class="acts"><button class="btn p" id="send">Send request</button></div><button class="btn t" id="x">Not now</button>`);
  document.querySelectorAll('#kinds button').forEach(b=>b.onclick=()=>requestSheet(b.dataset.k));
  $('#x').onclick=close; $('#send').onclick=()=>{close();toast(`Asked · still ends ${s.until}`)};
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}
$('#hana').onclick=()=>{const h=$('#hana'),f=face[cur];  ALL.forEach(id=>{if(id[0]==='e')$('#'+id).style.display='none'});$('#eWink').style.display='';h.classList.add('tap');
  setTimeout(()=>{ALL.forEach(id=>$('#'+id).style.display=f.includes(id)?'':'none');h.classList.remove('tap')},650)};
/* review-only switcher */
const q=new URLSearchParams(location.search), st=q.get('state');
function load(name){m=JSON.parse(JSON.stringify(base));const p=presets[name]||{};
  for(const k in p) if(k!=='c') m[k]=p[k]; Object.assign(m.studios.cheongdam,p.c||{});
  cur=null;close();render();document.querySelectorAll('.dev button[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===name))}
if(st!==null||q.has('dev')){const d=$('#dev');d.hidden=false;
  Object.keys(presets).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.dataset.p=k;b.onclick=()=>{history.replaceState(null,'','?state='+k);load(k)};d.append(b)});
  [['⏩ 6:40pm',()=>{m.now='18:40';render()}],['⏩ 7:10pm',()=>{m.now='19:10';render()}],['✓ studio marks attended',()=>{const s=S();if(s.booking&&s.presence&&!s.attended){/* dev only: simulates the server after the studio marks attended */s.attended=true;s.remaining=s.afterClass;m.now='20:05';render()}}]]
   .forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.className='act';b.onclick=f;d.append(b)});}
load(presets[st]?st:null); /* default = base member: 2 of 10 left, ends 14 Oct */
</script>
</body>
</html>
