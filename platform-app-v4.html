<style>
  :root { --ink:#2A2430; --mute:#6B6270; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink);

    background:

  .wrap { max-width:980px; margin:0 auto; padding:48px 22px 72px; }

  h1 { font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(32px,5vw,48px); letter-spacing:-.03em; margin:0 0 10px; line-height:1.05; }
  .lede { font-size:18px; color:var(--mute); max-width:640px; line-height:1.45; margin:0 0 28px; }
  .lede b { color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:14px; }
  @media (max-width: 840px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width: 520px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  a.cast {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    text-decoration:none; color:inherit;
    background:#fff; border-radius:28px; padding:18px 12px 16px;
    box-shadow:0 10px 28px rgba(80,50,90,.08);
    border:2px solid transparent;
    transition:transform .15s ease, border-color .15s ease;
  }
  a.cast:hover { transform:translateY(-3px); border-color:var(--tint); }
  a.cast img { width:110px; height:140px; object-fit:contain; }
  a.cast b { font-family:"Fredoka",sans-serif; font-size:22px; font-weight:600; }
  a.cast small { color:var(--mute); font-weight:800; font-size:13px; }
  .row { margin-top:28px; display:flex; flex-wrap:wrap; gap:10px; }
  .row a {
    color:#B04A5E; font-weight:800; text-decoration:none;
    background:#fff; border-radius:999px; padding:10px 16px;
    box-shadow:0 4px 14px rgba(80,50,90,.08);
  }
</style>
