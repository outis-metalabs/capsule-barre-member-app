<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>D · Animated cat, mission, chat — Capsule Barre</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --ivory:#FDFBF0; --blush:#F6B1A6; --navy:#2F3E46; --ink:#3a3330; --mute:#7d6454; --ok:#2f6f4e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:#efe6d8; color:var(--ink); font-family:"IBM Plex Sans",sans-serif; display:grid; place-items:center; padding:24px; }
  .phone { width:390px; height:844px; background:var(--ivory); border-radius:40px; box-shadow:0 24px 60px rgba(47,62,70,.18); display:flex; flex-direction:column; overflow:hidden; }
  .top { padding:22px 18px 0; display:flex; justify-content:space-between; align-items:center; }
  .pill { background:#fff; border-radius:999px; padding:8px 12px; font-weight:700; font-size:13px; }
  .stage { display:flex; gap:8px; align-items:flex-end; padding:8px 16px 0; }
  .catwrap { width:108px; flex:none; }
  .catwrap.talk .cat { animation:talk .45s ease; }
  .catwrap.happy .cat { animation:hop .6s ease; }
  .cat { width:108px; transform-origin:50% 100%; animation:idle 2.8s ease-in-out infinite; }
  .eye { transform-origin:center; animation:blink 4.2s infinite; }
  @keyframes idle { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
  @keyframes talk { 0% { transform:rotate(0); } 30% { transform:rotate(-4deg) translateY(-2px); } 60% { transform:rotate(3deg); } 100% { transform:rotate(0); } }
  @keyframes hop { 0% { transform:translateY(0); } 40% { transform:translateY(-14px); } 100% { transform:translateY(0); } }
  @keyframes blink { 0%,92%,100% { transform:scaleY(1); } 96% { transform:scaleY(.1); } }
  .bubble { background:#fff; border-radius:16px 16px 16px 6px; padding:10px 12px; flex:1; box-shadow:0 8px 16px rgba(246,177,166,.3); font-size:14px; min-height:64px; }
  .who { color:var(--blush); font-size:11px; font-weight:700; letter-spacing:.08em; }
  .mission { margin:10px 16px 0; background:#fff; border-radius:16px; padding:4px 12px; }
  .step { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid #f0e6dc; font-size:14px; }
  .step:first-child { border-top:0; }
  .dot { width:22px; height:22px; border-radius:50%; background:#F8E4DF; color:var(--blush); display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }
  .dot.on { background:var(--ok); color:#fff; }
  .step span { color:var(--mute); font-size:12px; margin-left:auto; }
  .pass { margin:8px 16px 0; font-size:13px; color:var(--mute); }
  .pass b { color:var(--ink); font-size:16px; }
  .chat { flex:1; overflow:auto; padding:8px 16px 8px; display:flex; flex-direction:column; gap:8px; }
  .me { align-self:flex-end; background:var(--navy); color:#FDFBF0; border-radius:14px 14px 4px 14px; padding:8px 12px; max-width:80%; font-size:14px; }
  .them { align-self:flex-start; background:#fff; border-radius:14px 14px 14px 4px; padding:8px 12px; max-width:86%; font-size:14px; }
  form { display:flex; gap:8px; padding:8px 16px 18px; }
  input { flex:1; border:1px solid #eadfd4; background:#fff; border-radius:999px; min-height:48px; padding:0 16px; font:inherit; }
  button.send { width:48px; height:48px; border:0; border-radius:50%; background:var(--blush); color:#fff; font-weight:700; font-size:18px; }
  .note { position:fixed; left:24px; top:24px; width:280px; font-size:14px; }
  .note b { display:block; margin-bottom:6px; }
  @media (max-width:900px) { .note { position:static; width:auto; margin-bottom:16px; } body { display:block; } .phone { margin:0 auto; } }
</style>
</head>
<body>
<aside class="note"><b>D · Animated cat + mission + chat</b> Type to the cat. “Book 7”, “I’m here”, “How many left?” The mission ticks. The pass stays at 2 until the studio marks class.</aside>
<div class="phone">
  <div class="top"><div class="pill">Cheongdam ▾</div><span>🔔</span></div>
  <div class="stage">
    <div class="catwrap" id="catwrap">
      <svg class="cat" viewBox="0 0 120 120">
        <ellipse cx="60" cy="78" rx="34" ry="30" fill="#fff"/>
        <path d="M34 52 L22 18 L54 44 Z" fill="#fff"/><path d="M86 52 L98 18 L66 44 Z" fill="#fff"/>
        <path d="M36 50 L28 26 L50 44 Z" fill="#e6e6e6"/><path d="M84 50 L92 26 L70 44 Z" fill="#ddd"/>
        <ellipse class="eye" cx="48" cy="70" rx="5" ry="6" fill="#2F3E46"/>
        <ellipse class="eye" cx="72" cy="70" rx="5" ry="6" fill="#2F3E46"/>
        <ellipse cx="60" cy="80" rx="4" ry="3" fill="#F6B1A6"/>
        <path d="M54 84 Q60 89 66 84" fill="none" stroke="#E05A53" stroke-width="2"/>
        <rect x="44" y="96" width="32" height="16" rx="6" fill="#2F3E46"/>
        <path d="M54 96 h12 v5 h-12z" fill="#E05A53"/>
        <path d="M92 90 q16 8 4 18" fill="none" stroke="#cfcfcf" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="bubble"><div class="who">BUTLER</div><p id="say">Today’s mission is Barre at 7. Tell me when you want it.</p></div>
  </div>
  <div class="mission" id="mission"></div>
  <p class="pass" id="pass"></p>
  <div class="chat" id="chat"></div>
  <form id="form"><input id="text" placeholder="Book 7, I’m here, how many left?" autocomplete="off" /><button class="send" type="submit" aria-label="Send">↑</button></form>
</div>
<script>
const state = { booked: false, here: false, mood: "" };
const chat = [];
function say(text, mood) {
  document.getElementById("say").textContent = text;
  const wrap = document.getElementById("catwrap");
  wrap.classList.remove("talk", "happy");
  void wrap.offsetWidth;
  wrap.classList.add(mood === "happy" ? "happy" : "talk");
}
function reply(q) {
  const s = q.toLowerCase();
  if (/book|7|tonight|accept|yes/.test(s)) {
    if (state.booked) return ["You’re already in. Reformer 3. Still 2 left.", ""];
    state.booked = true;
    return ["Booked. 7:00 with Hana, reformer 3. Still 2 left.", "happy"];
  }
  if (/here|arrive|check/.test(s)) {
    if (!state.booked) return ["Book 7:00 first. Then I’ll check you in.", ""];
    if (state.here) return ["The desk already knows. See you at 7.", ""];
    state.here = true;
    return ["You’re here. I told the desk. The pass still says 2.", "happy"];
  }
  if (/left|pass|session|many/.test(s)) return ["Cheongdam 2 of 10, until 14 Oct. Geumho is separate, 8 of 20.", ""];
  if (/cancel/.test(s)) {
    if (!state.booked) return ["Nothing to cancel.", ""];
    state.booked = false; state.here = false;
    return ["Cancelled. Still 2 left. The mission is open again.", ""];
  }
  return ["I can book 7:00, check you in, or tell you how many are left.", ""];
}
function render() {
  document.getElementById("mission").innerHTML = [
    [state.booked, "1", "Book 7:00"],
    [state.here, "2", "I’m here"],
    [false, "3", "Studio marks class"]
  ].map(([on, n, t]) => `<div class="step"><div class="dot ${on ? "on" : ""}">${on ? "✓" : n}</div>${t}<span>${on ? "done" : "open"}</span></div>`).join("");
  document.getElementById("pass").innerHTML = `<b>2 left</b> of 10 · 14 Oct`;
  document.getElementById("chat").innerHTML = chat.map(m => `<div class="${m.role}">${m.text}</div>`).join("");
  const box = document.getElementById("chat");
  box.scrollTop = box.scrollHeight;
}
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("text");
  const q = input.value.trim();
  if (!q) return;
  chat.push({ role: "me", text: q });
  const [line, mood] = reply(q);
  chat.push({ role: "them", text: line });
  input.value = "";
  say(line, mood);
  render();
});
render();
</script>
</body>
</html>
