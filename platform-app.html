<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nari · multi-store member app (prototype)</title>
<meta name="description" content="Clickable prototype: one member account across many small businesses, booking by tap, sentence or demo call. Sample data only.">
<style>
:root{--cream:#F7F1EA;--card:#FFFDF9;--ink:#2B2326;--sub:#6B5E62;--rasp:#B04A5E;--raspd:#8E3346;--pink:#E98597;--mint:#A8D5C2;--line:#E3D7CC;--tint:#F6E3E7}
*{box-sizing:border-box}
html,body{margin:0;background:#EDE3D8;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:88px}
.skip{position:absolute;left:-999px;top:0}.skip:focus{left:8px;top:8px;z-index:50;background:#fff;padding:8px}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 8px 16px;background:rgba(247,241,234,.97);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.brand .nm{width:30px;height:30px;border-radius:10px;background:var(--rasp);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;gap:4px;flex:none}
.icb{min-width:44px;min-height:44px;border-radius:999px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:4px;position:relative;color:var(--ink);font-weight:600;font-size:13px}
.icb:hover{background:#EFE4DA}
.badge{position:absolute;top:5px;right:5px;min-width:18px;height:18px;border-radius:9px;background:var(--rasp);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
main{padding:12px 16px 28px;outline:none}
h1{font-size:22px;line-height:1.25;margin:6px 0 12px}
h2{font-size:17px;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:15px;margin:0 0 4px}
p{margin:0 0 8px}
.sub{color:var(--sub);font-size:14px}
.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--rasp)}
.btn{min-height:44px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--rasp);background:var(--rasp);color:#fff;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--raspd);border-color:var(--raspd)}
.btn.sec{background:var(--card);color:var(--rasp)}
.btn.sec:hover{background:var(--tint)}
.btn.ghost{border-color:var(--line);background:var(--card);color:var(--ink);font-weight:600}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;color:var(--rasp);font-weight:650;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;margin:0 -16px;padding-left:16px;padding-right:16px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:14px;text-align:left}
.chip:hover{border-color:var(--rasp)}
.scroll .chip{flex:none;white-space:nowrap}
.chip[aria-pressed=true]{border:1.5px solid var(--rasp);background:var(--tint);color:#74283A;font-weight:650}
:focus-visible{outline:3px solid #1F5FAD;outline-offset:2px}
.tag{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;background:#EFE4DA;color:var(--ink);white-space:nowrap}
.tag.ok{background:var(--mint)}
.tag.warn{background:#F3DFC4}
.tag.sp{background:#EDE6F2}
.slogo{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;color:#fff;font-weight:750;font-size:13px;flex:none;letter-spacing:.3px}
.slogo.lg{width:54px;height:54px;border-radius:16px;font-size:17px}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:18px;height:18px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;min-width:0;min-height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub)}
nav.tabs button[aria-current=page]{color:var(--rasp);font-weight:750}
nav.tabs button[aria-current=page] .ico{stroke-width:2.2}
/* hero scene card: posters have backgrounds, so they live inside a rounded frame */
.scene{display:flex;gap:0;overflow:hidden;padding:0;border-radius:22px;background:linear-gradient(135deg,#FBEFEA,#F3E7DA)}
.scene .pic{width:42%;max-width:160px;min-height:170px;background:#EFE3D6;flex:none;position:relative}
.scene .pic img,.scene .pic video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.scene .txt{padding:16px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.scene .who{font-size:12px;font-weight:700;color:var(--raspd);letter-spacing:.4px;text-transform:uppercase}
.scene .bow{position:absolute;right:8px;top:8px;width:26px;height:26px}
.av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;background:#EFE3D6;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.place{min-width:150px;max-width:170px;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.place:hover{border-color:var(--rasp)}
.place .n{font-weight:700;font-size:14px;line-height:1.25}
.place .dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--rasp)}
.place.add{align-items:center;justify-content:center;border-style:dashed;color:var(--rasp);font-weight:700;min-width:110px}
.up{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.up:first-child{border-top:0;padding-top:0}
.up .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mis{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mis:first-of-type{border-top:0}
.mis .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.mis.done .ck{background:var(--mint);border-color:var(--mint)}
.mis.done .mt{text-decoration:line-through;color:var(--sub)}
.bar{height:10px;border-radius:5px;background:#EADFD4;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rasp);border-radius:5px}
.week{display:flex;gap:6px}
.week span{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.week b{display:block;height:24px;border-radius:8px;background:#EADFD4;margin-bottom:3px}
.week b.on{background:var(--mint)}
.week b.rest{background:repeating-linear-gradient(45deg,#D6EADF,#D6EADF 4px,#EEF6F1 4px,#EEF6F1 8px)}
.pol{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;margin:0}
.pol dt{color:var(--sub)}.pol dd{margin:0;font-weight:600}
.svc{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);width:100%;text-align:left;min-height:56px}
.svc:hover{border-color:var(--rasp)}
.svc .pr{font-weight:700;white-space:nowrap}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);min-height:56px}
.slot:hover{border-color:var(--rasp)}
.slot .tm{font-weight:750;font-size:17px;min-width:56px}
.slot[disabled]{opacity:.6;cursor:not-allowed}
.opt{margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--sub)}
.sheet-bg{position:fixed;inset:0;background:rgba(43,35,38,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--cream);width:100%;max-width:430px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 16px 22px;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet .hd h2{margin:0;flex:1;font-size:18px}
.storebar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;color:#fff}
.storebar .sn{font-weight:750}
.storebar .sa{font-size:13px;opacity:.95}
.conf{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:14px;margin:12px 0}
.conf dt{color:var(--sub)}.conf dd{margin:0;font-weight:600}
.conf .tot{font-size:18px;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px;max-width:400px;width:calc(100% - 24px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.toast .tx{flex:1;font-size:14px;padding:6px 0}
.toast button{min-height:44px;border:0;background:transparent;color:#FFD3DC;font-weight:750;padding:0 12px;text-decoration:underline}
.chatbox{display:flex;gap:8px;align-items:flex-end}
.chatbox textarea,.inp{flex:1;min-height:48px;max-height:120px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;font:inherit;resize:none;color:var(--ink)}
.chatbox textarea:focus,.inp:focus{border-color:var(--rasp);outline:none;box-shadow:0 0 0 3px #F0C9D2}
.send{min-width:48px;min-height:48px;border-radius:50%;border:0;background:var(--rasp);color:#fff;display:grid;place-items:center}
.thread{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px}
.msg.me{align-self:flex-end;background:var(--rasp);color:#fff;border-bottom-right-radius:4px}
.msg.n{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.nrow{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:96%}
.nrow .av{width:32px;height:32px}
.mcard{margin-top:8px;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--cream)}
.mcard.care{border-color:#C9B9AE;background:#FBF6F1}
.src{font-size:12px;color:var(--sub);margin-top:6px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0 40px}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#5A4A2C;background:#F3E6C9;padding:3px 9px;border-radius:999px}
.spons{border:1px solid #DCD0E4;background:#FBF8FC}
.cover{height:84px;border-radius:18px 18px 0 0;margin:-14px -14px 12px;position:relative}
.qr{width:180px;height:180px;margin:12px auto;display:block;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}
.vf{height:220px;border-radius:18px;background:#2B2326;position:relative;margin:8px 0 12px;display:grid;place-items:center;color:#F7F1EA;font-size:14px;text-align:center;padding:20px}
.vf:before{content:"";position:absolute;inset:40px 70px;border:3px solid #F7F1EA;border-radius:16px;opacity:.85}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile .ic{width:40px;height:40px;border-radius:12px;background:#F2E8DE;display:grid;place-items:center;color:var(--raspd)}
.tile.lock{background:#F6F0EA;color:var(--sub)}
/* call screen */
#call{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#3A2E31,#2B2326);color:#F7F1EA;display:flex;justify-content:center}
#call[hidden]{display:none}
#call .in{width:100%;max-width:430px;display:flex;flex-direction:column;padding:16px;gap:12px;height:100%}
#call .cav{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:6px auto 0;border:3px solid #F7F1EA}
#call .cav img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
#call .wave{display:flex;gap:4px;justify-content:center;align-items:center;height:48px}
#call .wave i{width:5px;border-radius:3px;background:#F2B9C5;height:8px;transition:height .12s}
#call .caps{flex:1;overflow:auto;background:rgba(255,255,255,.07);border-radius:16px;padding:12px;font-size:16px;display:flex;flex-direction:column;gap:8px}
#call .caps .me{align-self:flex-end;background:rgba(255,255,255,.14);padding:6px 10px;border-radius:12px}
#call .caps .n b{color:#FFD3DC}
#call .ctl{display:flex;justify-content:center;gap:28px;padding:6px 0 10px}
#call .rb{width:64px;height:64px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff}
#call .rb[aria-pressed=true]{background:#F7F1EA;color:var(--ink)}
#call .rb.end{background:#C2364F}
#call .lbl{font-size:12px;text-align:center;margin-top:4px}
#call .demo{align-self:center}
#call .yes{display:flex;gap:10px;justify-content:center}
#call .yes .btn{background:#F7F1EA;color:var(--ink);border-color:#F7F1EA}
#call .yes .btn.sec{background:transparent;color:#F7F1EA}
.dcard{padding:10px}.dcard.sel{border-color:var(--rasp);box-shadow:0 0 0 2px #F0C9D2}.dhit{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:0;min-height:44px}.dtx{min-width:0;flex:1;line-height:1.5}
.dphoto{width:92px;height:92px;border-radius:14px;flex:none;display:grid;place-items:center;color:#4A3F42;position:relative}.dphoto .ico{width:30px;height:30px}.adtag{position:absolute;left:6px;top:6px;background:#fff;font-size:11px}
.dmap{width:100%;height:auto;display:block;margin-top:6px}.pin{cursor:pointer}.pin:focus-visible{outline:3px solid #1F5FAD}
.journey{width:100%;height:auto;display:block}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:350px){main{padding:10px 12px 24px}.scroll{margin:0 -12px;padding-left:12px;padding-right:12px}.scene .pic{width:38%}h1{font-size:20px}nav.tabs button{font-size:11px}}
</style>
</head>

<script>

const LI = () => (L === "vi" ? 0 : 1);
const N = s => (L !== "en" && NAMES[s]) ? NAMES[s][LI()] : s;
const nb = s => String(s).replace(/\u00a0/g, " ");
const tr = s => { if (L === "en" || s == null) return s; const e = TRD[s] || TRD[nb(s)]; return e ? e[LI()] : s; };

function nN(x) { x = x.trim(); let w = ""; const m = x.match(/^(.*?) with (.+)$/); if (m) { x = m[1]; w = m[2]; } x = N(x); if (!w) return x; return L === "vi" ? x + " với " + w : w + " " + x; }

/* ===== Call Nari: simulated in-app call (Dot-style), scripted, demo only ===== */
let CALL = null, waveT = null;
function openCall() {
  const vi = L === "vi", sl = slotsFor("pickle", "court", 1, { len: 60, paddles: 0 });

  const ko = L === "ko";
  const script = ko ? [
    ["n", "안녕하세요 미나, 예약 도우미 나리예요. 데모 통화라서 녹음되지 않고 실제 전화선도 쓰지 않아요. 무엇을 예약할까요?"],
    ["me", "내일 저녁 7시에 피클볼 코트 4명이요."],
    ["n", `Sunrise Pickleball Club ${N(court)}, 내일 ${tm}, 60분, 4명이에요. 합계 ${vnd(pr)}, 클럽에서 결제해요. ${dl}까지 무료 취소예요. 예약할까요?`],
    ["wait"], ["n", `완료! ${N(court)} 예약됐고, 다가오는 예약에 있어요.`]] : vi ? [
    ["n", "Xin chào, đây là Nari, trợ lý đặt lịch ảo. Đây là cuộc gọi demo, không ghi âm. Bạn muốn đặt gì ạ?"],
    ["me", "Cho mình đặt sân pickleball cho 4 người, tối mai 7 giờ."],
    ["n", `Sunrise còn ${court} ngày mai lúc ${tm}, 60 phút, 4 người, giá ${vnd(pr)}, trả tại sân. Hủy miễn phí trước ${dl}. Bạn xác nhận đặt nhé?`],
    ["wait"], ["n", `Đã đặt xong ${court}. Lịch đã có trong mục Sắp tới.`]]
  : [["n", "Hi Mina, this is Nari, your booking assistant. This is a demo call: nothing is recorded and no real phone line is used. What would you like to book?"],
    ["me", "A pickleball court for 4, tomorrow at 7pm."],
    ["n", `Sunrise Pickleball Club has ${court} tomorrow at ${tm}, 60 minutes, for 4 players. The total is ${vnd(pr)}, paid at the club. Free cancellation until ${dl}. Shall I book it?`],
    ["wait"], ["n", `Done. ${court} is booked, and it's in your Up next list.`]];
  CALL = { i: 0, muted: false, script, z, vi, ko, t0: Date.now(), timer: null, tick: null, ended: false };
  lastFocus = document.activeElement;
  const el = $("#call"); el.hidden = false;
  el.innerHTML = `<div class="in"><span class="demo">${L3("Demo call · not a real phone call", "Cuộc gọi demo · không phải cuộc gọi thật", "데모 통화 · 실제 전화가 아니에요")}</span><div class="cav"><img src="${A}greet.webp" alt="Nari"></div><div style="text-align:center"><b style="font-size:20px">Nari</b><div class="sm" id="cst">${tr("Connecting…")}</div></div>
    <div class="wave" id="wave" aria-hidden="true">${"<i></i>".repeat(24)}</div>
    <div class="caps" id="caps" role="log" aria-live="polite" aria-label="Live captions"></div><div class="yes" id="yes"></div>
    <div class="ctl"><div><button class="rb" id="mute" data-act="mute" aria-pressed="false" aria-label="${t("mute")}">${ic("mic")}</button><div class="lbl" id="mutel">${t("mute")}</div></div><div><button class="rb end" data-act="hang" aria-label="${t("hang")}">${ic("end")}</button><div class="lbl">${t("hang")}</div></div></div></div>`;
  $("#mute").focus();
  CALL.tick = setInterval(() => { const s = Math.floor((Date.now() - CALL.t0) / 1000), st = $("#cst"); if (st) st.textContent = tr("Connected") + " · " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }, 1000);
  CALL.timer = setTimeout(callStep, 500);
}
function wave(on) { const w = $("#wave"); if (!w) return; [...w.children].forEach((b, i) => { b.style.height = on ? (RM ? 18 : 8 + (hsh("w" + i + Date.now()) % 30)) + "px" : "8px"; }); }
function speak(text, lang, done) {
  let fired = false; const fin = () => { if (fired) return; fired = true; clearInterval(waveT); wave(false); done(); };
  clearInterval(waveT); wave(true); if (!RM) waveT = setInterval(() => wave(true), 140);
  const fb = setTimeout(fin, Math.max(1800, text.length * 42));
  try { if (!CALL.muted && "speechSynthesis" in window && window.SpeechSynthesisUtterance) { const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.onend = () => { clearTimeout(fb); setTimeout(fin, 150); }; speechSynthesis.cancel(); speechSynthesis.speak(u); } } catch (e) {}
}
function cap(who, text) { const c = $("#caps"); if (!c) return; const d = document.createElement("div"); d.className = who; d.innerHTML = who === "me" ? L3("You", "Bạn", "나") + ": " + esc(text) : "<b>" + L3("Nari", "Nari", "나리") + ":</b> " + esc(text); c.appendChild(d); c.scrollTop = c.scrollHeight; }
function callStep() {
  if (!CALL || CALL.ended) return; const st = CALL.script[CALL.i]; if (!st) return;
  if (st[0] === "n") { cap("n", st[1]); speak(st[1], CALL.ko ? "ko-KR" : CALL.vi ? "vi-VN" : "en-US", () => { if (!CALL || CALL.ended) return; CALL.i++; if (CALL.script[CALL.i]) CALL.timer = setTimeout(callStep, 350); else CALL.timer = setTimeout(() => endCall(), 1400); }); }
  else if (st[0] === "me") { cap("me", st[1]); CALL.i++; CALL.timer = setTimeout(callStep, 1200); }
  else if (st[0] === "wait") { $("#yes").innerHTML = `<button class="btn" data-act="callyes">${L3("Say “Yes”", "Nói “Đúng rồi”", "“네” 라고 말하기")}</button><button class="btn sec" data-act="callno">${L3("Say “No”", "Nói “Không”", "“아니요” 라고 말하기")}</button>`; $("#yes button").focus(); }
}
function callYes(y) {
  $("#yes").innerHTML = ""; cap("me", y ? L3("Yes.", "Đúng rồi.", "네.") : L3("No.", "Không.", "아니요."));
  if (!y) { const l = L3("Okay, nothing is booked.", "Vâng, chưa đặt gì cả.", "네, 아무것도 예약하지 않았어요."); CALL.i = 99; cap("n", l); speak(l, CALL.ko ? "ko-KR" : CALL.vi ? "vi-VN" : "en-US", () => { CALL && (CALL.timer = setTimeout(endCall, 900)); }); return; }
  const z = CALL.z; if (z) CALL.booking = doBook({ store: "pickle", svc: "court", d: 1, m: z.m, len: 60, rids: z.rids, price: z.price, party: 4, paddles: 0, source: "voice" }, true);
  CALL.i++; CALL.timer = setTimeout(callStep, 400);
}
function endCall() {
  if (!CALL) return; CALL.ended = true; clearTimeout(CALL.timer); clearInterval(CALL.tick); clearInterval(waveT); try { speechSynthesis.cancel(); } catch (e) {}
  const b = CALL.booking; CALL = null; $("#call").hidden = true; $("#call").innerHTML = ""; render();
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); else $("#view").focus();
  toast(b ? `Call ended · ${t("booked")}: ${resName("pickle", b.rids[0])}, ${fWhen(b.d, b.m)}` : "Call ended · nothing booked", b ? () => { cancelB(b); render(); toast("Booking undone. Nothing charged."); } : null);
}

/* ===== events ===== */
document.addEventListener("click", e => {

  const bk = id => B.find(b => b.id === +id);
  switch (a) {
    case "close": clearInterval(stretchT); closeSheet(); break;
    case "tab": ST.tab = d.v; ST.store = null; ST.page = null; closeSheet(); render(); window.scrollTo(0, 0); $("#view").focus(); break;
    case "back": if (ST.page) { ST.page = ST.page === "nset" && ST.fromFeed ? "notif" : null; ST.fromFeed = false; render(); $("#view").focus(); break; } ST.store = null; render(); window.scrollTo(0, 0); $("#view").focus(); break;

    case "lang": openSheet(sheetHd(t("language")) + `<div class="stack">${[["en", "English"], ["vi", "Tiếng Việt"], ["ko", "한국어"]].map(([k, l]) => `<button class="chip" style="width:100%" aria-pressed="${L === k}" data-act="setlang" data-v="${k}" lang="${k}">${l}</button>`).join("")}</div>`, t("language")); break;
    case "setlang": setLang(d.v); closeSheet(); render(); break;
    case "inbox": case "nfeed": ST.page = "notif"; ST.seenN = true; render(); window.scrollTo(0, 0); $("#view").focus(); break;
    case "nset": ST.fromFeed = ST.page === "notif"; ST.page = "nset"; render(); window.scrollTo(0, 0); $("#view").focus(); break;
    case "ntype": NSET.types[d.v] = el.checked; saveN(); render(); { const f = $(`[data-act="ntype"][data-v="${d.v}"]`); if (f) f.focus(); } break;
    case "nstore": NSET.muted[d.v] = !el.checked; saveN(); render(); { const f = $(`[data-act="nstore"][data-v="${d.v}"]`); if (f) f.focus(); } break;
    case "nfriend": NSET.friendOptIn = el.checked; NSET.types.friend = el.checked; saveN(); render(); { const f = $(`[data-act="nfriend"]`); if (f) f.focus(); } break;
    case "cheer": toast(L3("Cheer sent to Mai!", "Đã gửi cổ vũ cho Mai!", "마이에게 응원을 보냈어요!")); break;
    case "again": { const [sid, vid, o] = AGAIN[+d.i]; openBook(sid, vid, Object.assign({}, o)); break; }
    case "svc": openBook(d.s, d.v); break;
    case "classpick": { const z = slotsFor(d.s, d.v, +d.d).find(q => q.m === +d.m); if (z) openConfirm(Object.assign({}, z, { store: d.s, svc: d.v })); break; }
    case "bs": BS[d.k] = ["d", "len", "party", "paddles"].includes(d.k) ? +d.v : d.v; renderBook(); break;
    case "slot": { const z = slotsFor(BS.store, BS.svc, BS.d, bsOpts()).find(q => q.m === +d.m); if (z) openConfirm(Object.assign({}, z, { store: BS.store, svc: BS.svc, party: S[BS.store].kind === "rental" ? BS.party : 0, paddles: BS.paddles, move: BS.move })); break; }
    case "dobook": if (PEND) { const x = PEND; PEND = null; doBook(x); } break;
    case "succundo": { closeSheet(); const f = succUndo; succUndo = null; if (f) f(); break; }
    case "toastundo": if (toastUndo) { const f = toastUndo; toastUndo = null; $("#toast").hidden = true; f(); } break;
    case "managebk": manage(bk(d.id)); break;
    case "resched": { const b = bk(d.id), s = S[b.store]; openBook(b.store, b.svc, { move: b.id, d: b.d, staff: s.kind === "appt" ? b.rids[0] : "any", room: s.rooms ? b.rids[1] : "any", len: b.len, party: b.party || 4, paddles: b.paddles }); break; }
    case "cancelask": cancelAsk(bk(d.id)); break;
    case "cancelok": { const b = bk(d.id); cancelB(b); closeSheet(); render(); toast(`${t("cancelled")}: ${N(svcOf(b.store, b.svc).n)}`, () => { b.status = "confirmed"; if (b.usePass) { const p = WALLET[b.store].find(p => p.id === b.usePass); if (p) p.left--; } render(); toast("Booking restored"); }); break; }
    case "msgfrom": { const b = bk(d.id); closeSheet(); ST.store = b.store; render(); const ta = $("#sm-" + b.store); if (ta) { ta.scrollIntoView(); ta.focus(); } break; }
    case "checkin": checkin(bk(d.id)); break;

    case "joinsheet": joinSheet(); break;

    case "linkjoin": linkSheet(); break;
    case "linkopen": { const v = norm(($("#lk") || {}).value || ""); const sid = /nail/.test(v) ? "nails" : /yoga|bloom/.test(v) ? "yoga" : ORDER0.find(id => v.includes(id)) || "yoga"; closeSheet(); ST.store = sid; render(); if (!S[sid].joined) joinConsent(sid); break; }
    case "gosearch": closeSheet(); ST.tab = "discover"; ST.store = null; render(); $("#dq").focus(); break;
    case "join": joinConsent(d.v); break;
    case "joinok": doJoin(d.v); break;
    case "cat": ST.cat = d.v; renderView(); { const el2 = $(`[data-act="cat"][data-v="${d.v}"]`); if (el2) el2.focus(); } break;
    case "whyad": toast("Sponsored by area (Thảo Điền). Not based on your bookings or health."); break;
    case "fake": toast(d.v); break;
    case "buy": { const c = +d.c; if (ST.coins < c) { toast("Not enough coins yet. Missions earn coins. (Coin packs are a placeholder, no real purchase.)"); break; } ST.coins -= c; ST.owned.push(d.v); render(); toast("Demo: added to Nari's wardrobe. No real money used."); break; }
    case "call": openCall(); break;
    case "mute": if (CALL) { CALL.muted = !CALL.muted; el.setAttribute("aria-pressed", String(CALL.muted)); el.setAttribute("aria-label", CALL.muted ? t("unmute") : t("mute")); el.innerHTML = ic(CALL.muted ? "micoff" : "mic"); $("#mutel").textContent = CALL.muted ? t("unmute") : t("mute"); if (CALL.muted) try { speechSynthesis.cancel(); } catch (er) {} } break;
    case "hang": endCall(); break;

document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault(); const ta = f.querySelector("textarea"); const v = ta ? ta.value.trim() : "";

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && e.target.tagName === "TEXTAREA") { e.preventDefault(); const f = e.target.closest("form"); if (f) f.requestSubmit(); return; }
  if (e.key === "Escape") { if (CALL) endCall(); else if ($(".sheet")) { clearInterval(stretchT); closeSheet(); } return; }
  if (e.key === "Tab" && (CALL || $(".sheet"))) { const root = CALL ? $("#call") : $(".sheet"); const f = [...root.querySelectorAll("button:not([disabled]),input:not([disabled]),textarea,[href]")]; if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!root.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }

document.addEventListener("input", e => { if (e.target.id === "dq") { ST.q = e.target.value; const r = $("#dres"); if (r) { const tmp = document.createElement("div"); tmp.innerHTML = vDiscover(); r.innerHTML = tmp.querySelector("#dres").innerHTML; } } });

seed(); render();
