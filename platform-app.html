.up{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}

.spons{}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

/* ===== playful restyle (young, soft blush; raspberry #B04A5E for text/buttons, #E98597 decoration only) ===== */
:root{--cream:#FFF6F3;--card:#FFFFFF;--line:#F3DCD8;--tint:#FDE7EA}
html,body{background:linear-gradient(180deg,#FFE9E6 0%,#FFF1E8 45%,#FFF6F3 100%) fixed}
#app{background:transparent}
header.top{background:#FFF4F1;border-bottom:1px solid #F6DDE1;z-index:15}
h1{font-weight:850;letter-spacing:-.3px;font-size:24px}
h2{font-weight:800;font-size:18px;margin:28px 0 12px}
.card{border-radius:22px;border:0;box-shadow:0 6px 22px rgba(176,74,94,.08),0 1px 0 rgba(176,74,94,.04);padding:16px}
.btn{border-radius:999px;font-weight:750;box-shadow:0 4px 12px rgba(176,74,94,.18)}
.btn.sec,.btn.ghost{box-shadow:none}
.chip{border-radius:999px;border:1.5px solid var(--line);background:#fff}
.tag{border-radius:999px;background:#FCE4E2}
.tag.ok{background:#D9F0E6}
.svc,.slot,.place,.tile{border-radius:20px;border:0;box-shadow:0 4px 16px rgba(176,74,94,.07)}

  "Show this at the desk. It works offline.": ["Đưa mã này ở quầy. Dùng được khi không có mạng.", "데스크에 보여 주세요. 오프라인에서도 돼요."], "Demo: the store marks you attended": ["Demo: cửa hàng xác nhận bạn đã đến", "데모: 매장이 참석 처리"],
  "Slow breaths. Roll your shoulders, reach up, fold gently.": ["Thở chậm. Xoay vai, vươn lên, gập người nhẹ nhàng.", "천천히 숨 쉬어요. 어깨를 돌리고, 위로 뻗고, 부드럽게 숙여요."], "Stop if anything hurts.": ["Dừng lại nếu thấy đau.", "아프면 멈추세요."], "Finish (demo: skip the timer)": ["Hoàn thành (demo: bỏ qua hẹn giờ)", "완료 (데모: 타이머 건너뛰기)"],
  "The policy is saved with your booking, so a later change never surprises you.": ["Chính sách được lưu cùng lịch đặt, nên thay đổi sau này không làm bạn bất ngờ.", "정책이 예약과 함께 저장돼서 나중에 바뀌어도 놀랄 일이 없어요."], "free": ["miễn phí", "무료"], "Free": ["Miễn phí", "무료"], "Late cancel": ["Hủy muộn", "늦은 취소"],
  "You're inside the free window.": ["Bạn còn trong hạn hủy miễn phí.", "무료 취소 기간 안이에요."], " The class goes back on your pass.": [" Buổi học được trả lại vào gói.", " 수업이 이용권으로 돌아가요."],
  "Nothing is booked until you tap the button.": ["Chưa có gì được đặt cho đến khi bạn chạm nút.", "버튼을 누르기 전에는 예약되지 않아요."], "Not a real phone call": ["Không phải cuộc gọi thật", "실제 전화가 아니에요"], "Connecting…": ["Đang kết nối…", "연결 중…"], "Connected": ["Đã kết nối", "연결됨"],
  /* store content (stores keep their own text in each language) */
  "Ballet-inspired, low-impact. All levels.": ["Lấy cảm hứng từ ballet, nhẹ nhàng. Mọi trình độ.", "발레에서 온 저충격 운동. 모든 레벨."], "Machine class, 8 reformers.": ["Lớp tập máy, 8 reformer.", "기구 수업, 리포머 8대."], "Slow mobility and stretching.": ["Vận động chậm và giãn cơ.", "천천히 하는 가동성·스트레칭."],
  "Wash, cut and simple styling.": ["Gội, cắt và tạo kiểu đơn giản.", "샴푸, 커트, 간단한 스타일링."], "Wash and blow-dry.": ["Gội và sấy.", "샴푸와 드라이."], "Single-process colour. Patch-test questions go to your stylist.": ["Nhuộm một màu. Câu hỏi thử dị ứng xin hỏi thợ.", "단색 염색. 패치 테스트 문의는 디자이너에게."],
  "A moisture-focused facial for skin that feels dry or tight.": ["Chăm sóc da tập trung cấp ẩm cho da cảm thấy khô hoặc căng.", "건조하거나 당기는 느낌의 피부를 위한 보습 중심 페이셜."], "A simple facial with light, fragrance-free products.": ["Chăm sóc da đơn giản với sản phẩm nhẹ, không mùi.", "가볍고 무향인 제품을 쓰는 간단한 페이셜."],
  "Talk with a therapist before choosing a treatment.": ["Trò chuyện với chuyên viên trước khi chọn liệu trình.", "관리를 고르기 전에 테라피스트와 상담해요."], "A short relaxing massage.": ["Massage thư giãn ngắn.", "짧은 휴식 마사지."], "Full-body relaxing massage.": ["Massage thư giãn toàn thân.", "전신 휴식 마사지."],
  "Longer version, more time on back and shoulders.": ["Bản dài hơn, thêm thời gian cho lưng và vai.", "더 긴 코스, 등과 어깨에 시간을 더 써요."], "Foot and lower-leg massage.": ["Massage chân và bắp chân.", "발과 종아리 마사지."], "Gel colour, hands.": ["Sơn gel tay.", "손 젤 컬러."], "Shape, cuticle care, polish.": ["Dũa, chăm sóc da móng, sơn.", "모양 정리, 큐티클 케어, 컬러."], "All-levels vinyasa.": ["Vinyasa mọi trình độ.", "모든 레벨 빈야사."],
  "1 class from your pass": ["1 buổi từ gói của bạn", "이용권 1회 차감"], "Doors close 5 min after start": ["Đóng cửa 5 phút sau khi bắt đầu", "시작 5분 후 입장 마감"], "15 min grace, then we may shorten the service": ["Cho phép trễ 15 phút, sau đó có thể rút ngắn dịch vụ", "15분 유예, 이후 시술이 짧아질 수 있어요"],
  "Deposit is kept": ["Giữ lại tiền cọc", "예약금 반환 안 됨"], "10 min grace": ["Cho phép trễ 10 phút", "10분 유예"], "50% of the price": ["50% giá", "가격의 50%"], "Full price": ["Toàn bộ giá", "전액"], "Your time ends on schedule": ["Kết thúc đúng giờ đã đặt", "예정된 시간에 종료돼요"],
  "Half the court fee": ["Nửa phí sân", "코트 요금의 절반"], "Full court fee": ["Toàn bộ phí sân", "코트 요금 전액"], "Your block ends on time": ["Kết thúc đúng giờ", "정해진 시간에 종료"], "1 class": ["1 buổi", "1회"], "Doors close at start": ["Đóng cửa khi bắt đầu", "시작 시 입장 마감"],
  "10-class pass": ["Gói 10 buổi", "10회 이용권"], "5-massage package (Aroma 60)": ["Gói 5 lần massage (Aroma 60)", "마사지 5회 패키지 (아로마 60)"], "Store credit": ["Tín dụng cửa hàng", "매장 크레딧"], "Valid until 30 Nov": ["Hạn đến 30/11", "11월 30일까지"], "Valid until 31 Dec": ["Hạn đến 31/12", "12월 31일까지"], "No expiry": ["Không hết hạn", "만료 없음"],
  /* Cici's fixed lines */
  "Hi Mina, I'm Cici. I can book at any of your places, move a booking, or answer simple questions about them.": ["Chào Mina, mình là Cici. Mình có thể đặt lịch ở mọi nơi của bạn, đổi lịch, hoặc trả lời câu hỏi đơn giản.", "안녕하세요 미나, 저는 " + CICI_KO + "예요. 모든 매장의 예약과 변경, 간단한 질문을 도와드려요."],
  "Pregnancy massage at Soom Spa is from the second trimester. If you're unsure, check with your GP or midwife first.": ["Massage bầu ở Soom Spa dành cho mẹ từ tam cá nguyệt thứ hai. Nếu chưa chắc, hãy hỏi nữ hộ sinh hoặc nơi bạn khám thai trước nhé.", "Soom Spa 임산부 마사지는 임신 중기부터 받을 수 있어요. 확실하지 않으면 다니는 산부인과에 먼저 확인해 주세요."],
  "If you're hurt or unwell, please see a doctor or your instructor. I can help with bookings too.": ["Nếu bạn bị đau hoặc không khỏe, hãy gặp bác sĩ hoặc huấn luyện viên của bạn. Mình cũng có thể giúp đặt lịch.", "다쳤거나 몸이 안 좋다면 의사나 담당 강사와 상의해 주세요. 예약도 도와드릴게요."],
  "Thanks for telling me. Please stop exercising now and get medical help right away.": ["Cảm ơn bạn đã cho mình biết. Hãy dừng tập ngay và tìm trợ giúp y tế ngay lập tức.", "말해 줘서 고마워요. 지금 바로 운동을 멈추고 즉시 의료 도움을 받으세요."],
  "Thanks for telling me. For skin concerns, please check with a dermatologist or our therapist.": ["Cảm ơn bạn đã chia sẻ. Với vấn đề về da, hãy hỏi bác sĩ da liễu hoặc chuyên viên của chúng tôi.", "말해 줘서 고마워요. 피부 고민은 피부과 전문의나 테라피스트와 상담해 주세요."],
  "Thanks for telling me. Please see a doctor or your instructor before your visit.": ["Cảm ơn bạn đã cho mình biết. Hãy gặp bác sĩ hoặc huấn luyện viên của bạn trước buổi hẹn.", "말해 줘서 고마워요. 방문 전에 의사나 담당 강사와 상의해 주세요."],
  "I can't promise results. Here's how Glow Lab describes its facials; the therapist can talk it through with you.": ["Mình không hứa hẹn kết quả. Đây là cách Glow Lab mô tả các liệu trình; chuyên viên có thể trao đổi thêm với bạn.", "결과는 약속할 수 없어요. Glow Lab의 페이셜 설명이에요. 자세한 건 테라피스트와 이야기해 보세요."],
  "Hi Mina! What would you like to book?": ["Chào Mina! Bạn muốn đặt gì?", "안녕 미나! 무엇을 예약할까요?"], "Anytime!": ["Không có gì!", "언제든지요!"], "Okay, nothing booked.": ["Vâng, chưa đặt gì cả.", "네, 아무것도 예약하지 않았어요."],
  "Here's how Glow Lab describes its facials. For skin concerns, please check with a dermatologist or our therapist.": ["Đây là cách Glow Lab mô tả các liệu trình. Với vấn đề về da, hãy hỏi bác sĩ da liễu hoặc chuyên viên.", "Glow Lab의 페이셜 설명이에요. 피부 고민은 피부과 전문의나 테라피스트와 상담해 주세요."],
  "Which place's prices?": ["Giá của nơi nào?", "어느 매장 가격이요?"], "Which place? I'll check their info.": ["Nơi nào? Mình sẽ xem thông tin.", "어느 매장이요? 정보를 확인할게요."],
  "Tap “Book” on the card when you're ready. I never book without your tap.": ["Khi sẵn sàng, chạm “Đặt lịch” trên thẻ. Mình không bao giờ đặt khi bạn chưa chạm.", "준비되면 카드의 “예약하기”를 눌러 주세요. 누르지 않으면 절대 예약하지 않아요."],
  "I didn't catch that. Want to ask a place directly? Replies land in your inbox.": ["Mình chưa hiểu. Bạn muốn hỏi trực tiếp cửa hàng không? Trả lời sẽ về hộp thư.", "잘 못 알아들었어요. 매장에 직접 물어볼까요? 답장은 받은 메시지로 와요."],
  "I can book at any of your places, or answer simple questions. Try one of these:": ["Mình có thể đặt lịch ở mọi nơi của bạn, hoặc trả lời câu hỏi đơn giản. Thử một câu:", "모든 매장의 예약이나 간단한 질문을 도와드려요. 이렇게 해 보세요:"],
  "Which place?": ["Nơi nào?", "어느 매장이요?"], "Which place would you like to book?": ["Bạn muốn đặt ở đâu?", "어느 매장에 예약할까요?"], "How many players?": ["Mấy người chơi?", "몇 명이 치나요?"],
  "Here it is. Nothing is booked until you tap Book.": ["Đây ạ. Chưa có gì được đặt cho đến khi bạn chạm Đặt lịch.", "여기 있어요. 예약하기를 누르기 전에는 예약되지 않아요."], "Sorry, I got mixed up. Try again?": ["Xin lỗi, mình bị rối. Thử lại nhé?", "죄송해요, 헷갈렸어요. 다시 해 볼래요?"],
  "Undone. Nothing charged.": ["Đã hoàn tác. Không tính phí.", "되돌렸어요. 청구된 건 없어요."], "That one's already cancelled.": ["Lịch đó đã hủy rồi.", "이미 취소된 예약이에요."], "That slot just went. Here's what's open.": ["Giờ đó vừa có người đặt. Đây là giờ còn trống.", "방금 그 시간이 마감됐어요. 남은 시간이에요."],
  "I've set 1 hour; say “2 hours” to change it.": ["Mình để 1 tiếng; nói “2 tiếng” để đổi.", "1시간으로 했어요. 바꾸려면 “2시간”이라고 말해 주세요."], "Another day": ["Ngày khác", "다른 날"],
  "Book a skin consultation": ["Đặt tư vấn da", "피부 상담 예약"], "Book Hydrating facial": ["Đặt chăm sóc da cấp ẩm", "수분 페이셜 예약"], "Book a court": ["Đặt sân", "코트 예약"], "Book Aroma 60": ["Đặt Aroma 60", "아로마 60 예약"], "Book Aroma 90": ["Đặt Aroma 90", "아로마 90 예약"],
  "Get help now": ["Tìm trợ giúp ngay", "지금 도움 받기"], "Get medical help right away": ["Tìm trợ giúp y tế ngay", "즉시 의료 도움 받기"], "Stop now, and tell the staff nearby.": ["Dừng lại ngay và báo nhân viên gần đó.", "지금 멈추고 가까운 직원에게 알려 주세요."],
  "Glow Lab's descriptions": ["Mô tả của Glow Lab", "Glow Lab 설명"], "Facials": ["Chăm sóc da", "페이셜"], "From Glow Lab Skincare's service list. No results are promised.": ["Từ danh sách dịch vụ của Glow Lab. Không hứa hẹn kết quả.", "Glow Lab 서비스 목록 기준. 결과를 약속하지 않아요."],
  "From Sunrise Pickleball Club's info": ["Theo thông tin của Sunrise Pickleball Club", "Sunrise Pickleball Club 정보 기준"], "From Capsule Barre's info": ["Theo thông tin của Capsule Barre", "Capsule Barre 정보 기준"], "From Soom Spa's price list": ["Theo bảng giá Soom Spa", "Soom Spa 가격표 기준"],
  "Grip socks (the desk sells them), a water bottle and comfy fitted clothes. Arrive 10 minutes early for your first class.": ["Vớ chống trượt (quầy có bán), bình nước và quần áo ôm thoải mái. Buổi đầu hãy đến sớm 10 phút.", "논슬립 양말(데스크 판매), 물병, 편한 운동복이요. 첫 수업은 10분 일찍 와 주세요."],
  "Motorbike parking at the front; cars park on the street.": ["Gửi xe máy phía trước; ô tô đỗ ngoài đường.", "오토바이는 앞쪽, 자동차는 길가에 주차해요."], "Motorbike parking in the alley next door.": ["Gửi xe máy ở hẻm bên cạnh.", "오토바이는 옆 골목에 주차해요."],
  "From Soom Spa's info: the 60-minute is a full-body relax; the 90-minute adds more time on back and shoulders. Both use the same oil.": ["Theo thông tin Soom Spa: gói 60 phút thư giãn toàn thân; gói 90 phút thêm thời gian cho lưng và vai. Cả hai dùng cùng loại dầu.", "Soom Spa 정보: 60분은 전신 휴식, 90분은 등과 어깨에 시간을 더 써요. 오일은 같아요."],
  "Non-marking court shoes, water and a towel. Paddles can be rented for 30.000 ₫ each, and balls are free. Arrive 10 minutes early to warm up.": ["Giày không để lại vết, nước và khăn. Có thể thuê vợt 30.000 ₫ mỗi cây, bóng miễn phí. Đến sớm 10 phút để khởi động.", "자국 안 남는 코트화, 물, 수건이요. 패들은 개당 30.000 ₫에 빌릴 수 있고 공은 무료예요. 10분 일찍 와서 몸을 풀어요."],
  "Outdoor, lit courts. 200.000 ₫/h before 17:00, 280.000 ₫/h after.": ["Sân ngoài trời có đèn. 200.000 ₫/giờ trước 17:00, 280.000 ₫/giờ sau đó.", "조명 있는 야외 코트. 17:00 전 시간당 200.000 ₫, 이후 280.000 ₫."],
  "Booking undone. Nothing charged.": ["Đã hoàn tác lịch. Không tính phí.", "예약을 되돌렸어요. 청구된 건 없어요."], "Move undone": ["Đã hoàn tác đổi lịch", "변경을 되돌렸어요"], "Booking restored": ["Đã khôi phục lịch", "예약을 복원했어요"], "Stretch done · +20 XP": ["Giãn cơ xong · +20 XP", "스트레칭 완료 · +20 XP"],
  "Rest day logged · +20 XP · your week still counts": ["Đã ghi ngày nghỉ · +20 XP · tuần của bạn vẫn được tính", "쉬는 날 기록 · +20 XP · 이번 주도 인정돼요"], "Call ended · nothing booked": ["Cuộc gọi kết thúc · chưa đặt gì", "통화 종료 · 예약 없음"],
  
  "Demo: added to Cici's look. No real money used.": ["Demo: đã thêm vào phong cách Cici. Không dùng tiền thật.", "데모: " + CICI_KO + " 스타일에 추가했어요. 실제 돈은 쓰지 않았어요."], "Not enough coins yet. Missions earn coins. (Coin packs are a placeholder, no real purchase.)": ["Chưa đủ xu. Làm nhiệm vụ để nhận xu. (Gói xu chỉ là chỗ giữ, không mua thật.)", "코인이 부족해요. 미션으로 모을 수 있어요. (코인 팩은 자리 표시용, 실제 구매 없음)"],
  "Calls the store's phone (demo).": ["Gọi điện cho cửa hàng (demo).", "매장에 전화 (데모)."], "Opens the store's KakaoTalk chat (demo).": ["Mở chat KakaoTalk của cửa hàng (demo).", "매장 카카오톡 채팅 열기 (데모)."], "Opens the store's Zalo chat (demo).": ["Mở chat Zalo của cửa hàng (demo).", "매장 Zalo 채팅 열기 (데모)."], "Opens directions (demo).": ["Mở chỉ đường (demo).", "길찾기 열기 (데모)."],
  "Teacher": ["Giáo viên", "강사"], "Free cancel ended": ["Hết hạn hủy miễn phí", "무료 취소 기간 종료"], "spots open": ["chỗ trống", "자리 있음"],
